    --toast-fg: #FFFFFF;
    --radius: 14px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
  }

  body {
    background:
      radial-gradient(120% 90% at 50% -10%, var(--bg-top) 0%, var(--paper) 55%) fixed;
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
    transition: background .25s ease, color .25s ease;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 28px 20px 72px;
  }

  /* ---- topbar ---- */
  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
  }

  .brand-mark {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -.02em;
    line-height: 1;
    display: block;
  }

  .brand-mark .dot {
    color: var(--accent);
  }

  .brand-sub {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
    display: block;
    white-space: nowrap;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: #E8E2E3;
    padding: 4px;
    border-radius: 999px;
  }

  .tab {
    border: 0;
    background: transparent;
    cursor: pointer;
    padding: 8px 16px;
    border-radius: 999px;
    font-family: "Inter";
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
  }

  .tab.is-active {
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(40,14,22,.12);
  }

  .tab {
    white-space: nowrap;
  }

  .tab .tab-n {
    display: inline-grid;
    place-items: center;
    box-sizing: border-box;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    margin-left: 7px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    vertical-align: 1px;
  }

  .tab .tab-n[hidden] {
    display: none;
  }

  body.theme-dark .tab .tab-n {
    color: #1C1415;
  }

  .top-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .theme-btn {
    width: 38px;
    height: 38px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .theme-btn:hover {
    border-color: var(--accent);
  }

  /* ---- panels ---- */
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 18px;
  }

  .panel-title {
    font-family: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
    font-weight: 700;
    font-size: 17px;
    margin: 0 0 16px;
    letter-spacing: -.01em;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  .panel-head .panel-title {
    margin: 0;
  }

  .gemini-btn {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gemini-btn:hover {
    border-color: var(--accent);
  }

  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }

  .field {
    display: flex;
    flex-direction: column;
  }

  .lab {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }

  .lab .opt {
    text-transform: none;
    letter-spacing: 0;
    opacity: .7;
  }

  .in {
    font-family: "Inter";
    font-size: 16px;
    color: var(--ink);
    background: #FBF8F9;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 13px;
    width: 100%;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }

  .in::placeholder {
    color: #AEA0A3;
  }

  .in:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .in.is-dup,
  .in.is-dup:focus {
    border-color: var(--warn);
    background: #FFF7EE;
    box-shadow: 0 0 0 3px rgba(224, 138, 30, .18);
  }

  .dup-warn {
    display: none;
    font-size: 12.5px;
    color: var(--warn);
    font-weight: 500;
    margin: -4px 2px 14px;
  }

  .dup-warn.show {
    display: block;
  }

  .btn {
    font-family: "Inter";
    font-weight: 600;
    font-size: 15px;
    border-radius: 11px;
    cursor: pointer;
    border: 1px solid transparent;
    padding: 12px 18px;
    transition: transform .08s, filter .15s, background .15s;
  }

  .btn:active {
    transform: translateY(1px);
    filter: brightness(.95);
  }

  .btn-ghost:active {
    background: var(--accent-soft);
  }

  .btn-danger {
    background: var(--again);
    color: #fff;
  }

  .btn-danger:hover {
    filter: brightness(1.06);
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    width: 100%;
  }

  .btn-primary:hover {
    filter: brightness(1.06);
  }

  .btn-primary:disabled {
    opacity: .55;
    cursor: default;
  }

  .btn-ghost {
    background: transparent;
    border-color: var(--line);
    color: var(--ink);
  }

  .btn-ghost:hover {
    background: #F7F3F4;
  }

  .btn-gonzalo {
    background: var(--der);
  }

  .btn-maria {
    background: var(--die);
  }

  .hint {
    font-size: 12.5px;
    color: var(--muted);
    margin: 12px 2px 0;
  }

  /* ---- deck list ---- */
  .deck-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .deck-head .panel-title {
    margin: 0;
  }

  .deck-count {
    font-family: "IBM Plex Mono";
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .06em;
  }

  .deck-head-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .dir-toggle {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 8px;
    padding: 5px 9px;
    cursor: pointer;
  }

  .dir-toggle:hover {
    border-color: var(--accent);
  }

  .dir-toggle .dir-arrow {
    color: var(--muted);
    font-size: 12px;
  }

  .dir-toggle .flag {
    margin-left: 0;
  }

  .deck-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .row {
    border-top: 1px solid var(--line);
  }

  .row:first-child {
    border-top: 0;
  }

  .deck-more {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    padding: 14px 2px 2px;
    border-top: 1px solid var(--line);
  }


  .stats { flex-wrap: wrap; align-items: center; }

  .stats .undo-btn { margin: 0 0 0 auto; font-size: 12.5px; }

  .k-tools { display: flex; align-items: center; gap: 12px; }

  .say { display: none; border: 0; background: transparent; color: #BFB4B6; cursor: pointer; padding: 3px 5px; border-radius: 7px; line-height: 0; }
  body.tts-on .say { display: inline-flex; align-items: center; }
  .say svg { width: 17px; height: 17px; }
  .say:hover { color: var(--accent); }
  .k-say { padding: 6px; color: var(--muted); }
  .k-say svg { width: 21px; height: 21px; }

  .sw-row { margin-top: 14px; }

  .newlim { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: -6px 0 16px 2px; font-size: 13px; }
  .newlim-t { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .newlim-i { color: var(--ink); }

  /* ---- pestaña Mazo: buscador y filtros ---- */
  .deck-tools { display: flex; flex-direction: column; gap: 10px; margin: 0 0 12px; }
  .deck-search .in { -webkit-appearance: none; appearance: none; }
  .deck-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .fsel { display: inline-flex; align-items: center; gap: 7px; }
  .deck-chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); cursor: pointer; }
  .deck-filters .link-btn { margin-left: auto; font-size: 12.5px; }
  .empty .link-btn { display: inline-block; margin-top: 8px; }

  /* ---- racha general y resumen del selector ---- */
  .pick-streak { --flame: #E4491C; display: inline-flex; align-items: center; gap: calc(4 * var(--u)); padding: calc(5 * var(--u)) calc(26 * var(--u)) calc(5 * var(--u)) calc(12 * var(--u)); background: var(--p-card); border: calc(4 * var(--u)) solid var(--p-line); border-radius: 999px; box-shadow: calc(6 * var(--u)) calc(6 * var(--u)) 0 var(--p-shadow); color: var(--flame); cursor: default; }
  body.theme-dark .pick-streak { --flame: #FF8A4C; }
  .pick-streak .ps-flame { flex: none; width: calc(92 * var(--u)); height: calc(92 * var(--u)); margin: calc(-16 * var(--u)) calc(-2 * var(--u)) calc(-16 * var(--u)) calc(-4 * var(--u)); filter: drop-shadow(calc(3 * var(--u)) calc(3 * var(--u)) 0 var(--p-shadow)); }
  .pick-streak .ps-txt { display: flex; flex-direction: column; align-items: flex-start; }
  .pick-streak b { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: calc(52 * var(--u)); line-height: 1; letter-spacing: -.01em; }
  .pick-streak small { margin-top: calc(2 * var(--u)); font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: calc(15 * var(--u)); line-height: 1; letter-spacing: .08em; text-transform: uppercase; color: var(--p-muted); }
  .pick-streak.is-zero { color: var(--p-muted); }
  .pick-streak.is-zero .ps-flame .fo { fill: var(--p-muted); opacity: .5; }
  .pick-streak.is-zero .ps-flame .fi { fill: var(--p-card); opacity: .9; }
  .goal-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 16px; font-size: 14px; }
  .goal-row label { color: var(--ink); }
  .goal-row + .act-sub { margin-top: 16px; }   /* el texto explicativo no va pegado a la meta */

  /* ---- escribir la respuesta ---- */
  .typed { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
  .typed .in { font-size: 18px; text-align: center; }
  .typed-btns { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .typed-btns .btn { width: auto; flex: 0 0 auto; min-width: 180px; }
  .typed-btns .link-btn { margin-top: 0; white-space: nowrap; }
  .typed-res { margin-top: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; line-height: 1.5; text-align: center; }
  .typed-res.ok { border-color: var(--easy); }
  .typed-res.near { border-color: var(--hard); }
  .typed-res.bad { border-color: var(--again); }
  .r.suggested { border-color: currentColor; box-shadow: 0 0 0 2px currentColor; }

  /* ---- pausar y entradas difíciles ---- */
  .k-pause { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 7px; line-height: 0; }
  .k-pause svg { width: 21px; height: 21px; }
  .k-pause:hover { color: var(--accent); }
  .pause { border: 0; background: transparent; color: #BFB4B6; cursor: pointer; padding: 3px 6px; border-radius: 7px; line-height: 0; }
  .pause svg { width: 16px; height: 16px; }
  .pause:hover { color: var(--accent); background: var(--accent-soft); }
  .row.is-paused .row-main { opacity: .5; }
  .chip.chip-hard { color: var(--again); background: #FBECEA; }
  .leech-note { margin-top: 16px; padding: 10px 12px; border: 1px solid var(--again); border-radius: 10px; font-size: 13.5px; line-height: 1.5; color: var(--ink); }
  .leech-note .link-btn { margin: 0; }

  /* ---- hueco, dictado, otros idiomas y «Hoy» ---- */
  .k-cloze { font-size: 24px; line-height: 1.55; font-weight: 600; }
  .cloze-blank { display: inline-block; min-width: 3ch; height: 1em; border-bottom: 2px solid var(--accent); margin: 0 .15em; vertical-align: baseline; }
  .k-trans { color: var(--muted); font-size: 15px; margin-top: 10px; line-height: 1.5; }
  .k-trans b { color: var(--ink); }
  .k-dict-front { font-size: 22px; }
  .k-dict { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .typed-diff { margin-top: 8px; font-size: 15px; line-height: 1.7; }
  .dd-bad { color: var(--again); text-decoration: underline; font-weight: 600; }
  .dd-acc { text-decoration: underline wavy var(--hard); }
  .k-xl { margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 14px; }
  .k-xl-t { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .xl { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .row-xl { padding: 2px 6px 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
  .hoy-list { list-style: none; margin: 14px 0 0; padding: 0; }
  .hoy-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 11px 8px; border-top: 1px solid var(--line); border-radius: 8px; color: inherit; text-decoration: none; }
  .hoy-list li:first-child .hoy-row { border-top: 0; }
  .hoy-row:hover, .hoy-row:focus-visible { background: var(--accent-soft); outline: none; }
  .hoy-name { font-weight: 600; }
  .hoy-n { margin-left: auto; color: var(--muted); font-size: 13.5px; }
  .hoy-n b { color: var(--ink); }
  .hoy-go { color: var(--accent); font-size: 13px; }
  .hoy-conj { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 14px; line-height: 1.6; }
  .hoy-conj .link-btn { margin: 0; }
  body.theme-dark .chip.chip-hard { background: #3A2320; }
  .sel-sm { width: auto; min-width: 0; padding: 5px 9px; font-size: 14px; border-radius: 9px; }
  @media (pointer: coarse) { .sel-sm { font-size: 16px; } }
  .sel { width: auto; min-width: 190px; }

  .st-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .st-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .fc { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 8px; }
  .fc-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .fc-bar { width: 100%; height: 64px; background: var(--accent-soft); border-radius: 6px; display: flex; align-items: flex-end; overflow: hidden; }
  .fc-bar i { display: block; width: 100%; background: var(--accent); border-radius: 6px 6px 0 0; }
  .fc-n { font-size: 12px; font-weight: 600; color: var(--ink); }
  .fc-d { font-size: 11px; color: var(--muted); }
  @media (max-width: 520px) { .st-grid { grid-template-columns: 1fr 1fr; } }


  .list-imp { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .list-imp textarea { min-height: 120px; resize: vertical; margin-bottom: 10px; }
  .list-prev { margin-top: 14px; font-size: 13.5px; color: var(--ink); }
  .list-prev ul { margin: 8px 0 14px; padding-left: 18px; color: var(--muted); }

  .deck-more-info {
    color: var(--muted);
    font-size: 13px;
    flex: 1 1 100%;
  }

  .deck-more .link-btn {
    margin-top: 0;
  }

  .row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 2px;
  }

  .row-frase {
    padding: 2px 6px 12px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .rf-es {
    color: var(--muted);
    font-size: 14px;
  }

  .rf-de {
    font-size: 15px;
    font-weight: 500;
  }

  .row-main {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
    flex-wrap: wrap;
  }

  .row-es {
    color: var(--ink);
    font-weight: 500;
  }

  .row-arrow {
    color: #C5BABC;
    font-size: 13px;
  }

  .row-de {
    color: var(--neutral);
    font-weight: 600;
    font-family: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  }

  .row-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .chip {
    font-family: "IBM Plex Mono";
    font-size: 9.5px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    background: #F4F0F1;
    border-radius: 6px;
    padding: 3px 7px;
  }

  .chip-btn {
    font-family: "IBM Plex Mono", monospace;
    font-size: 9.5px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    background: #F4F0F1;
    border: 0;
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
  }

  .chip-btn:hover {
    color: var(--accent);
  }

  .chip-btn.on {
    color: var(--accent);
    background: var(--accent-soft);
  }

  .del {
    border: 0;
    background: transparent;
    color: #BFB4B6;
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 7px;
  }

  .del:hover {
    color: var(--again);
    background: #FBECEA;
  }

  .edit {
    border: 0;
    background: transparent;
    color: #BFB4B6;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 3px 6px;
    border-radius: 7px;
  }

  .edit:hover {
    color: var(--accent);
    background: var(--accent-soft);
  }

  /* voces disponibles (Actividad) */
  .voice-list {
    list-style: none;
    margin: 8px 0 0;
    padding: 0;
    font-size: 13px;
  }

  .voice-list li {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    padding: 3px 0;
    color: var(--muted);
  }

  .voice-list li.cur .vg {
    font-weight: 700;
  }

  .voice-list .vk {
    width: 1.2em;
    text-align: center;
    font-weight: 700;
  }

  .voice-list .ok .vk {
    color: var(--good, #1f9d55);
  }

  .voice-list .warn .vk,
  .voice-list .no .vk {
    color: var(--again);
  }

  .voice-list .vg {
    min-width: 5.5em;
    color: var(--ink);
  }

  .voice-list .vn {
    color: var(--ink);
  }

  .voice-list .vl {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
  }

  /* IPA: transcripción fonética de la palabra (Wiktionary) */
  .ipa {
    border: 0;
    background: transparent;
    color: #BFB4B6;
    cursor: pointer;
    padding: 3px 5px;
    border-radius: 7px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .04em;
    line-height: 1.4;
  }

  .ipa:hover,
  .ipa.on {
    color: var(--accent);
    background: var(--accent-soft);
  }

  .k-ipa {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 7px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
  }

  .k-ipa:hover,
  .k-ipa.on {
    color: var(--accent);
  }

  .ipa-box {
    margin: 8px 0 2px;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--paper);
    font-size: 14px;
    line-height: 1.6;
    text-align: left;
  }

  .ipa-form + .ipa-form {
    margin-top: 4px;
  }

  .ipa-w {
    margin-right: 4px;
  }

  .ipa-sym {
    font-family: "Noto Sans", "Segoe UI", "DejaVu Sans", "Charis SIL", system-ui, sans-serif;
    font-size: 16px;
    color: var(--ipa);
  }

  .ipa-it {
    margin-right: 8px;
  }

  .ipa-lab,
  .ipa-note,
  .ipa-warn {
    color: var(--muted);
    font-size: 12px;
  }

  .ipa-warn {
    color: var(--again);
  }

  .ipa-err {
    color: var(--again);
  }

  .ipa-src {
    margin-left: 4px;
    font-size: 12px;
    color: var(--ipa-src);
  }

  .ipa-src a {
    color: inherit;
  }

  /* «+»: añadir la entrada a otro idioma */
  .imp {
    border: 0;
    background: transparent;
    color: #BFB4B6;
    cursor: pointer;
    padding: 3px 6px;
    border-radius: 7px;
    line-height: 0;
  }

  .imp svg {
    width: 17px;
    height: 17px;
  }

  .imp:hover,
  .imp[aria-expanded="true"] {
    color: var(--accent);
    background: var(--accent-soft);
  }

  .k-imp {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    padding: 6px;
    border-radius: 7px;
    line-height: 0;
  }

  .k-imp svg {
    width: 21px;
    height: 21px;
  }

  .k-imp:hover,
  .k-imp[aria-expanded="true"] {
    color: var(--accent);
  }

  .imp-menu {
    position: fixed;
    z-index: 60;
    min-width: 250px;
    max-width: calc(100vw - 16px);
    max-height: min(70vh, 460px);
    overflow: auto;
    padding: 6px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 20px 50px -20px rgba(0, 0, 0, .55);
  }

  .imp-title {
    padding: 6px 10px 8px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: .04em;
    color: var(--muted);
  }

  .imp-opt {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 10px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
  }

  .imp-opt:hover,
  .imp-opt:focus-visible {
    background: var(--accent-soft);
    outline: none;
  }

  .imp-opt .lang-nat {
    margin-left: auto;
    color: var(--muted);
    font-size: 12px;
  }

  .imp-bar {
    margin: 0 0 14px;
    padding: 12px 14px;
    border: 1px solid var(--accent);
    border-radius: 12px;
    background: var(--accent-soft);
    font-size: 14px;
    line-height: 1.45;
  }

  .imp-bar .flag {
    vertical-align: -2px;
  }

  .imp-bar-s {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
  }

  .row.is-editing {
    background: var(--accent-soft);
    border-radius: 8px;
  }

  .flag {
    display: inline-block;
    width: 19px;
    height: 13px;
    border-radius: 2px;
    vertical-align: -1px;
    margin-left: 4px;
    box-shadow: 0 0 0 1px rgba(40,14,22,.14);
  }

  .btn-block {
    width: 100%;
    margin-top: 8px;
  }

  /* ---- study ---- */
  .study {}

  .seg {
    display: inline-flex;
    background: #E8E2E3;
    padding: 4px;
    border-radius: 11px;
    margin-bottom: 16px;
  }

  .seg-btn {
    border: 0;
    background: transparent;
    cursor: pointer;
    padding: 8px 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    color: var(--muted);
  }

  .seg-btn.is-active {
    background: #fff;
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(40,14,22,.1);
  }

  .stats {
    display: flex;
    gap: 20px;
    margin-bottom: 18px;
    padding-left: 2px;
  }

  .stat {
    font-size: 13px;
    color: var(--ink);
  }

  .stat b {
    font-family: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
    font-weight: 700;
    font-size: 15px;
  }

  .stat-muted {
    color: var(--muted);
  }

  /* ---- Karteikarte (elemento firma) ---- */
  .karte {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 30px 28px 24px;
    min-height: 230px;
    overflow: hidden;
    box-shadow: 0 10px 30px -18px rgba(40,14,22,.4);
  }

  .karte::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--accent), #D9475F);
  }

  .k-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }

  .k-tag {
    font-family: "IBM Plex Mono";
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .switch {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 0;
    background: transparent;
    cursor: pointer;
    padding: 0;
  }

  .switch-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .switch-track {
    width: 34px;
    height: 20px;
    border-radius: 999px;
    background: #D9D0D1;
    position: relative;
    transition: background .18s;
  }

  .switch-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(40,14,22,.3);
    transition: transform .18s;
  }

  .switch.on .switch-track {
    background: var(--accent);
  }

  .switch.on .switch-thumb {
    transform: translateX(14px);
  }

  .k-front {
    font-family: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -.015em;
    color: var(--ink);
    line-height: 1.15;
  }

  .k-divider {
    height: 1px;
    background: var(--line);
    margin: 22px 0 20px;
  }

  .k-back {
    font-family: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
    font-weight: 800;
    font-size: 34px;
    letter-spacing: -.02em;
    color: var(--neutral);
    line-height: 1.15;
    animation: rise .34s cubic-bezier(.2, .7, .2, 1) both;
  }

  .k-back-sent {
    font-size: 26px;
    font-weight: 700;
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(9px);
    }

    to {
      opacity: 1;
      transform: none;
    }
  }

  .reveal {
    margin-top: 26px;
  }

  .k-hint {
    font-family: "IBM Plex Mono";
    font-size: 10.5px;
    color: #AEA0A3;
    text-align: center;
    letter-spacing: .08em;
    margin-top: 12px;
  }

  .link-btn {
    margin-top: 16px;
    border: 0;
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    font-weight: 600;
    font-size: 13.5px;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .k-sent {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    animation: rise .28s ease both;
  }

  .k-sent-es {
    color: var(--muted);
    font-size: 15px;
  }

  .k-sent-de {
    color: var(--ink);
    font-size: 16px;
    font-weight: 500;
  }

  .rate {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 26px;
  }

  .r {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 10px;
    cursor: pointer;
    padding: 11px 6px 9px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-family: "Inter";
    transition: transform .08s, box-shadow .15s, border-color .15s;
  }

  .r:active {
    transform: translateY(1px);
  }

  .r span {
    font-weight: 600;
    font-size: 13.5px;
  }

  .r em {
    font-family: "IBM Plex Mono";
    font-style: normal;
    font-size: 11px;
    color: var(--muted);
  }

  .r-again {
    color: var(--again);
  }

  .r-again:hover {
    border-color: var(--again);
    box-shadow: 0 0 0 2px #FBEAE8;
  }

  .r-hard {
    color: var(--hard);
  }

  .r-hard:hover {
    border-color: var(--hard);
    box-shadow: 0 0 0 2px #F6EEDD;
  }

  .r-good {
    color: var(--good);
  }

  .r-good:hover {
    border-color: var(--good);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }

  .r-easy {
    color: var(--easy);
  }

  .r-easy:hover {
    border-color: var(--easy);
    box-shadow: 0 0 0 2px #DDF1EA;
  }

  .r.pressed {
    transform: translateY(1px);
  }

  .r-again.pressed {
    background: #FBEAE8;
    border-color: var(--again);
  }

  .r-hard.pressed {
    background: #F6EEDD;
    border-color: var(--hard);
  }

  .r-good.pressed {
    background: var(--accent-soft);
    border-color: var(--good);
  }

  .r-easy.pressed {
    background: #DDF1EA;
    border-color: var(--easy);
  }

  /* ---- empty / done ---- */
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 16px;
    font-size: 15px;
  }

  .empty b {
    color: var(--ink);
    font-weight: 600;
  }

  .done {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .done-mark {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #DDF1EA;
    color: var(--easy);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin-bottom: 8px;
  }

  .done .btn-ghost {
    margin-top: 14px;
  }

  .muted {
    color: var(--muted);
  }

  /* ---- legend ---- */
  .legend {
    display: flex;
    gap: 16px;
    margin-bottom: 14px;
  }

  .lg {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .04em;
  }

  .lg i {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    display: inline-block;
  }

  /* ---- actividad ---- */
  .act-sub {
    font-size: 13px;
    color: var(--muted);
    margin: -8px 0 18px;
  }

  .act-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 16px;
  }

  .act-head .panel-title {
    margin: 0;
  }

  .act-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .act-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    background: #FBFAFA;
  }

  .act-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .act-nums {
    display: flex;
    gap: 28px;
  }

  .act-n {
    display: flex;
    flex-direction: column;
  }

  .act-n b {
    font-family: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
    font-weight: 800;
    font-size: 36px;
    line-height: 1;
    letter-spacing: -.03em;
    color: var(--ink);
  }

  .act-n span {
    font-size: 12px;
    color: var(--muted);
    margin-top: 7px;
  }

  .backup-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 6px;
  }

  .backup-row .btn {
    font-size: 14px;
    padding: 10px 15px;
  }

  /* ---- identidad ---- */
  .who-choose {
    display: flex;
    gap: 12px;
    margin-top: 6px;
  }

  .who-choose .btn {
    flex: 1;
  }

  /* ---- actividad por persona ---- */
  .who-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .who-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
    background: #FBFAFA;
  }

  .who-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }

  .who-name {
    font-family: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
    font-weight: 800;
    font-size: 19px;
    letter-spacing: -.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .who-you {
    font-family: "IBM Plex Mono", monospace;
    font-size: 9px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #fff;
    background: var(--accent);
    padding: 2px 6px;
    border-radius: 5px;
  }

  .who-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px solid var(--line);
  }

  .who-row:first-of-type {
    border-top: 0;
  }

  .who-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .who-val {
    font-size: 13.5px;
    color: var(--muted);
  }

  .who-val b {
    font-family: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
    font-weight: 700;
    color: var(--ink);
    font-size: 16px;
  }

  .who-foot {
    font-size: 13px;
    color: var(--muted);
    margin: 16px 2px 0;
  }

  .who-foot .link-btn {
    font-size: 13px;
  }

  .by {
    font-family: "IBM Plex Mono", monospace;
    font-size: 9.5px;
    letter-spacing: .06em;
    color: var(--muted);
    background: #F4F0F1;
    border-radius: 6px;
    padding: 3px 7px;
  }

  /* ---- toast ---- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translate(-50%, 20px);
    background: var(--toast-bg);
    color: var(--toast-fg);
    padding: 11px 18px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 20;
    box-shadow: 0 8px 24px -10px rgba(0, 0, 0, .5);
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .toast.bad {
    background: var(--again);
  }

  /* ---- modal ---- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(22,8,12,.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 20px;
    animation: fade .15s ease;
  }

  @keyframes fade {
    from {
      opacity: 0;
    }

    to {
      opacity: 1;
    }
  }

  .modal {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 20px 50px -20px rgba(0, 0, 0, .55);
  }

  .modal-title {
    font-family: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
    font-weight: 700;
    font-size: 17px;
    margin: 0 0 8px;
    color: var(--ink);
  }

  .modal-word {
    font-size: 15px;
    color: var(--muted);
    margin: 0 0 20px;
  }

  .modal-word span {
    font-family: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
    font-weight: 600;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }

  .modal-actions .btn {
    flex: 1;
  }

  /* ---- selector de idioma (pantalla previa) ---- */
  /* 1u = 1px con la ventana a 1920 de ancho; el selector escala con la ventana para verse siempre como el modelo */
  :root {
    --u: clamp(.6px, calc(100vw / 1920), 1px);
  }

  [hidden] {
    display: none !important;
  }

  body {
    --p-bg: #FBEEF1;
    --p-dot: #F0C9D3;
    --p-card: #FFFFFF;
    --p-ink: #33121A;
    --p-line: #33121A;
    --p-muted: #7A4A55;
    --p-accent: #8A1A33;
    --p-on-accent: #FFFFFF;
    --p-shadow: rgba(51,18,26,.16);
    --amb: #8B47D1;
  }

  body.theme-dark {
    --p-bg: #1B0E12;
    --p-dot: #2A171C;
    --p-card: #26151A;
    --p-ink: #F7E9EC;
    --p-line: #C98D9B;
    --p-muted: #CFA5AF;
    --p-accent: #E8788F;
    --p-on-accent: #1B0E12;
    --p-shadow: rgba(0, 0, 0, .55);
    --amb: #B98AF5;
  }

  body.on-picker {
    background: radial-gradient(circle, var(--p-dot) calc(2.4 * var(--u)), transparent calc(3 * var(--u))) 0 0 / calc(33 * var(--u)) calc(33 * var(--u)), var(--p-bg);
  }

  .pick {
    max-width: calc(1500 * var(--u));
    margin: 0 auto;
    padding: calc(31 * var(--u)) calc(28 * var(--u)) calc(44 * var(--u));
    color: var(--p-ink);
    font-family: "Nunito", "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .pick-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: calc(16 * var(--u));
    margin-bottom: calc(47 * var(--u));
  }

  .pick-sub {
    display: block;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500;
    font-size: calc(17 * var(--u));
    line-height: 1.5;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--p-accent);
  }

  .pick-title {
    margin: calc(5 * var(--u)) 0 0;
    font-family: "Fredoka", sans-serif;
    font-weight: 700;
    font-size: calc(39 * var(--u));
    line-height: 1;
    letter-spacing: -.01em;
    text-transform: uppercase;
  }

  .pick-theme {
    flex: none;
    width: calc(66 * var(--u));
    height: calc(66 * var(--u));
    margin-top: calc(5 * var(--u));
    padding: 0;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: calc(4 * var(--u)) solid var(--p-line);
    background: var(--p-card);
    color: var(--p-ink);
    box-shadow: calc(6 * var(--u)) calc(6 * var(--u)) 0 var(--p-shadow);
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }

  .pick-theme svg {
    width: calc(30 * var(--u));
    height: calc(30 * var(--u));
  }

  .pick-theme:hover {
    transform: translate(calc(-2 * var(--u)), calc(-2 * var(--u)));
    box-shadow: calc(8 * var(--u)) calc(8 * var(--u)) 0 var(--p-shadow);
  }

  .pick-theme:active {
    transform: translate(calc(4 * var(--u)), calc(4 * var(--u)));
    box-shadow: calc(2 * var(--u)) calc(2 * var(--u)) 0 var(--p-shadow);
  }

  .pick-panel {
    padding: calc(31 * var(--u)) calc(33 * var(--u)) calc(34 * var(--u));
    background: var(--p-card);
    border: calc(4 * var(--u)) solid var(--p-line);
    border-radius: calc(48 * var(--u));
    box-shadow: calc(9 * var(--u)) calc(9 * var(--u)) 0 var(--p-shadow);
  }

  .pick-btns {
    display: flex;
    flex: none;
    gap: calc(14 * var(--u));
    margin-top: calc(5 * var(--u));
  }

  .pick-btns .pick-theme {
    margin-top: 0;
  }

  .pick-head {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    column-gap: calc(24 * var(--u));
  }

  .pick-head .pick-streak {
    grid-column: 1;
    justify-self: start;
  }

  .pick-head .pick-h2 {
    grid-column: 2;
  }

  .pick-h2 {
    margin: 0;
    text-align: center;
    font-family: "Fredoka", sans-serif;
    font-weight: 700;
    font-size: calc(57 * var(--u));
    line-height: 1.1;
    letter-spacing: 0;
  }

  .pick-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: calc(24 * var(--u));
    margin-top: calc(38 * var(--u));
  }

  .lang-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;

<script>
(function(){

  var CUR = 'vocabulando';

    {id:'vocabulando', name:'Vocabulando', sub:'Vocabulario y frases', url:'../Vocabulando/Vocabulando.html'},
    {id:'conjugario',  name:'Conjugario',  sub:'Conjugaciones',        url:'../Conjugario/index.html'},

  ];
  var ST = " fill='none' stroke='#FFFFFF' stroke-width='7.2' stroke-linecap='round' stroke-linejoin='round'";
  var GLYPH = {
    vocabulando: "<path d='M14.5 19 L27 45.5 L39.5 19'" + ST + "/>",
    conjugario:  "<path d='M35.36 22.54 A13 13 0 1 0 35.36 42.46'" + ST + "/>",
    declinario:  "<path d='M17.5 19 H26 A13.25 13.25 0 0 1 26 45.5 H17.5 Z'" + ST + "/>",

  function logo(id){
    var g = 'sibg' + (++nLogo);
    return '<svg class="applogo" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><linearGradient id="' + g + '" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#8A152C"/><stop offset="1" stop-color="#5A0D1C"/></linearGradient></defs>' +
      '<rect width="64" height="64" rx="15" fill="url(#' + g + ')"/>' + GLYPH[id] + '<circle cx="49" cy="44.2" r="4.9" fill="#FFB020"/></svg>';

    try{ if(window.__sibTheme) return window.__sibTheme(); }catch(e){}

  function chipOf(w){ return w.querySelector('.appchip'); }

    var h = /^#[a-z]{2}$/.test(location.hash) ? location.hash : '';
    menuOf(w).innerHTML = APPS.map(function(a){
      var inner = logo(a.id) + '<span class="apptx"><span class="appnm">' + a.name + '</span><span class="appsb">' + a.sub + '</span></span>';
      return a.id === CUR
        ? '<span class="appopt" role="menuitem" tabindex="-1" aria-current="page" data-app="' + a.id + '">' + inner + '</span>'
        : '<a class="appopt" role="menuitem" data-app="' + a.id + '" href="' + a.url + h + '">' + inner + '</a>';

  }
  function close(w, refocus){
    var m = menuOf(w), b = chipOf(w);

    var me = APPS.filter(function(a){ return a.id === CUR; })[0];
    wraps.forEach(function(w){

    function fsIn(c) { var o = {}; for (var k in c) o[k] = c[k]; o.due = fsTime(c.due); if (c.last_review) o.last_review = fsTime(c.last_review); return o; }
    function fsOut(c, now, nowFs) {
      var o = {}; for (var k in c) o[k] = c[k];
      o.due = new Date(now.getTime() + (c.due.getTime() - nowFs.getTime()));
      if (c.last_review) o.last_review = new Date(now.getTime());
      return o;
    }
    function schedNext(card, rating) { var now = new Date(), nf = fsTime(now); return fsOut(scheduler.next(fsIn(card), nf, rating).card, now, nf); }
    function schedPreview(card) { // { Again, Hard, Good, Easy } → tarjeta resultante de cada valoración
      var now = new Date(), nf = fsTime(now), rec = scheduler.repeat(fsIn(card), nf), out = {};
      ["Again", "Hard", "Good", "Easy"].forEach(function (r) { out[r] = fsOut(rec[FS.Rating[r]].card, now, nf); });
      return out;
    }
    function findEntry(id) { for (var i = 0; i < S.deck.length; i++) { if (S.deck[i].id === id) return S.deck[i]; } return null; }

    // ---- carpeta de datos (File System Access API: Chrome / Edge) ----
    // El usuario elige una carpeta una sola vez y en ella se guarda un archivo por idioma. El asa de la carpeta se recuerda
    // en IndexedDB; si el navegador la olvida (borrado de caché) basta con volver a elegir la carpeta: los archivos siguen ahí.
    var F = {
      supported: !!window.showDirectoryPicker,
      dir: null, name: "", files: {}, err: {},
      state: "none" // none | needs-permission | connected | error | unsupported
    };
    function idbOpen() {
      return new Promise(function (res, rej) {
        var r = indexedDB.open("vocabulando", 1);
        r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      });
    }
    async function idbGet(k) {
      try {
        var db = await idbOpen();
        return await new Promise(function (res, rej) { var q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { rej(q.error); }; });
      } catch (e) { return null; }
    }
    async function idbSet(k, v) {
      try {
        var db = await idbOpen();
        await new Promise(function (res, rej) { var tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = res; tx.onerror = function () { rej(tx.error); }; });
        return true;
      } catch (e) { return false; }
    }
    async function hasPerm(h, ask) {
      var o = { mode: "readwrite" };
      try {
        if ((await h.queryPermission(o)) === "granted") return true;
        if (ask && (await h.requestPermission(o)) === "granted") return true;
      } catch (e) { }
      return false;
    }
    async function writeTo(h, text) {
      var w = await h.createWritable();
      try { await w.write(text); await w.close(); } catch (e) { try { await w.abort(); } catch (e2) { } throw e; }
      return (await h.getFile()).lastModified;
    }

    // lee el archivo del idioma: { status: "missing" | "invalid" | "ok", bucket, empty }
    async function readLangFile(code) {
      var h;
      try { h = await F.dir.getFileHandle(fileName(code)); }
      catch (e) { if (e && e.name === "NotFoundError") return { status: "missing" }; throw e; }
      var f = await h.getFile(), text = await f.text();
      F.files[code] = { handle: h, lastModified: f.lastModified };
      if (!text.trim()) return { status: "ok", bucket: emptyBucket(), empty: true }; // archivo vacío = idioma nuevo
      var b = parseLang(text, code);
      return b ? { status: "ok", bucket: b } : { status: "invalid" };
    }

    // abre el idioma: lee su archivo (o lo crea) y lo fusiona con lo que hubiera sin guardar
    async function doLoad(code) {
      var local = DATA.languages[code] || readCache(code) || emptyBucket();
      DATA.languages[code] = local;
      F.err[code] = null;
      if (F.state === "connected") {
        try {
          var r = await readLangFile(code);
          if (r.status === "invalid") { F.err[code] = "invalid"; }
          else if (r.status === "ok") {
            var dirty = isDirty(code);
            DATA.languages[code] = dirty ? mergeBucket(r.bucket, local) : r.bucket;
            if (dirty || r.empty) await persistLang(code); else lsSet(K_DATA + code, stringifyLang(code));
          } else { await persistLang(code); } // aún no existe: se crea con lo que haya
        } catch (e) { F.state = "error"; }
      }
      loaded[code] = true;
    }

    // guarda un idioma: copia espejo + su archivo. "dirty" marca cambios que aún no están en el archivo.
    async function persistLang(code) {
      var text = stringifyLang(code), cached = lsSet(K_DATA + code, text), wrote = false;
      if (F.state === "connected" && F.err[code] !== "invalid") {
        try {
          var h = await F.dir.getFileHandle(fileName(code), { create: true });
          F.files[code] = { handle: h, lastModified: await writeTo(h, text) };
          wrote = true; lsSet(K_DIRTY + code, "0");
        } catch (e) { F.state = "error"; renderBanners(); }
      }
      if (!wrote) lsSet(K_DIRTY + code, "1");
      return wrote || cached || !LS; // sin ningún almacenamiento solo queda la memoria (ya se avisa al arrancar)
    }

    // trae a memoria lo que otra pestaña, otro equipo o una edición manual haya cambiado en el archivo del idioma
    async function refreshIfChanged(code) {
      var fl = F.files[code];
      if (F.state !== "connected" || !fl) return false;
      try {
        var f = await fl.handle.getFile();
        if (f.lastModified === fl.lastModified) return false;
        var b = parseLang(await f.text(), code);
        fl.lastModified = f.lastModified;
        if (!b) { F.err[code] = "invalid"; renderBanners(); return false; } // se rompió desde fuera: no se toca
        var wasBad = !!F.err[code], dirty = isDirty(code);
        F.err[code] = null;
        DATA.languages[code] = dirty ? mergeBucket(b, bucket(code)) : b;
        if (dirty) await persistLang(code); else lsSet(K_DATA + code, stringifyLang(code));
        if (wasBad) renderBanners();
        return true;
      } catch (e) {
        if (e && e.name === "NotFoundError") { delete F.files[code]; return false; } // lo borraron: el siguiente guardado lo recrea
        F.state = "error"; renderBanners(); return false;
      }
    }

    // Todas las lecturas y escrituras pasan por aquí, de una en una: releer archivo → aplicar cambio → guardar.
    var chain = Promise.resolve();
    function commit(fn, codes) {
      codes = codes || [S.lang];
      var cur = S.lang;
      var run = chain.then(async function () {
        for (var i = 0; i < codes.length; i++) { if (!loaded[codes[i]]) await doLoad(codes[i]); await refreshIfChanged(codes[i]); }
        // copia para deshacer solo de los idiomas que van a cambiar (no de todos los abiertos en la sesión)
        var snap = {};
        codes.forEach(function (c) { if (DATA.languages[c]) snap[c] = JSON.stringify(DATA.languages[c]); });
        if (fn(cur ? bucket(cur) : null) === false) { bindLang(); return false; }
        bindLang();
        var ok = true;
        for (var j = 0; j < codes.length; j++) { if (!(await persistLang(codes[j]))) ok = false; }
        if (!ok) { Object.keys(snap).forEach(function (c) { DATA.languages[c] = JSON.parse(snap[c]); }); bindLang(); }
        xl.at = 0; // lo que ven «otros idiomas» ha podido cambiar
        return ok;
      });
      chain = run.catch(function () { });
      return run;
    }
    function loadLang(code) {
      var run = chain.then(function () { return doLoad(code); });
      chain = run.catch(function () { });
      return run;
    }

    // al conectar la carpeta: vuelca ya a sus archivos los idiomas con cambios sin guardar, para que no dependan de la caché
    async function flushPending() {
      for (var i = 0; i < LANGS.length; i++) {
        var c = LANGS[i].code;
        if (!loaded[c] && isDirty(c) && readCache(c)) await loadLang(c);
      }
    }
    async function connectDir(h) {
      F.dir = h; F.name = h.name; F.files = {}; F.err = {};
      if (!(await hasPerm(h, true))) { F.state = "needs-permission"; renderBanners(); toast("Sin permiso para escribir en la carpeta.", true); return false; }
      F.state = "connected"; loaded = {};
      await idbSet("dir", h);
      if (S.lang) await loadLang(S.lang);
      if (F.state === "connected") await flushPending();
      bindLang(); renderBanners(); render();
      if (F.state === "connected") toast("Guardando en la carpeta «" + F.name + "»");
      else toast("No se pudo leer la carpeta. Elige otra.", true);
      return F.state === "connected";
    }
    async function initFile() {
      if (!F.supported) { F.state = "unsupported"; return; }
      var h = await idbGet("dir");
      if (!h) { F.state = "none"; return; }
      F.dir = h; F.name = h.name;
      F.state = (await hasPerm(h, false)) ? "connected" : "needs-permission";
    }
    async function pickFolder() {
      var h;
      try { h = await window.showDirectoryPicker({ id: "vocabulando", mode: "readwrite", startIn: "documents" }); }
      catch (e) { if (!e || e.name !== "AbortError") toast("No se pudo abrir la carpeta.", true); return; }
      await connectDir(h);
    }
    async function reconnect() {
      if (!F.dir) { await pickFolder(); return; }
      if (!(await hasPerm(F.dir, true))) { toast("Sin permiso para escribir en la carpeta.", true); return; }
      await connectDir(F.dir);
    }
    function syncFromFile() {
      chain = chain.then(async function () {
        if (!S.lang || !loaded[S.lang]) return;
        if (!(await refreshIfChanged(S.lang))) return;
        bindLang();
        if (!formHasText()) render();
      }).catch(function () { });
    }

    // ---- altas, ediciones y repasos ----
    async function addEntry(v) {
      var id = uid();
      var ok = await commit(function (b) {
        var e = { id: id, esWord: v.esWord, deWord: v.deWord, esSent: v.esSent, deSent: v.deSent, createdAt: Date.now() };
        if (v.gender) e.gender = v.gender;
        if (v.autoGender) e.autoGender = v.autoGender;
        if (v.esGender) e.esGender = v.esGender;
        if (v.esAutoGender) e.esAutoGender = v.esAutoGender;
        b.deck.push(e);
      });
      return ok ? id : false;
    }
    async function updateEntry(id, v) {
      var ok = await commit(function (b) {
        var e = null; b.deck.forEach(function (x) { if (x.id === id) e = x; });
        if (!e) return false;
        if (e.deWord !== v.deWord) delete e.autoGender; // otra palabra: hay que volver a consultar
        if (e.esWord !== v.esWord) delete e.esAutoGender;
        e.esWord = v.esWord; e.deWord = v.deWord; e.esSent = v.esSent; e.deSent = v.deSent; e.updatedAt = Date.now();
        if (v.gender) e.gender = v.gender; else delete e.gender;
        if (v.autoGender) e.autoGender = v.autoGender;
        if (v.esGender) e.esGender = v.esGender; else delete e.esGender;
        if (v.esAutoGender) e.esAutoGender = v.esAutoGender;
      });
      return ok ? id : false;
    }
    async function deleteEntry(id) {
      S.undo = S.undo.filter(function (u) { return u.key.split(":")[0] !== id; });
      return commit(function (b) {
        b.deck = b.deck.filter(function (e) { return e.id !== id; });
        MODES.forEach(function (m) { delete b.review[id + ":" + m]; });
      });
    }
    async function rate(key, ratingName) {
      var code = S.lang, rec = null;
      var ok = await commit(function (b) {
        var raw = b.review[key], card = raw ? reviveCard(raw) : FS.createEmptyCard(new Date());
        var wasNew = !raw || raw.state === FS.State.New, now = new Date(), day = dateKey(now.getTime()), mode = key.split(":")[1];
        var next = schedNext(card, FS.Rating[ratingName]);
        b.review[key] = next;
        b.stats.reviewsTotal += 1; b.stats.byDay[day] = (b.stats.byDay[day] || 0) + 1;
        if (wasNew) { var nk = day + ":" + mode; b.stats.newByDay[nk] = (b.stats.newByDay[nk] || 0) + 1; }
        var cut = dateKey(now.getTime() - 14 * 86400000); // de las nuevas por día solo interesan los últimos días
        Object.keys(b.stats.newByDay).forEach(function (k) { if (k.slice(0, 10) < cut) delete b.stats.newByDay[k]; });
        var row = [Math.floor(now.getTime() / 1000), key, FS.Rating[ratingName], wasNew ? 0 : raw.state];
        b.log.push(row); trimLog(b);
        rec = { code: code, key: key, prev: raw ? JSON.stringify(raw) : null, after: next.last_review.getTime(), wasNew: wasNew, day: day, mode: mode, row: row };
      });
      if (!ok) { toast("No se pudo guardar el repaso.", true); return false; }
      S.undo.push(rec); if (S.undo.length > 20) S.undo.shift();
      return true;
    }

    // Un repaso a la vez: con la carpeta conectada guardar tarda un instante y, sin este freno, una doble pulsación (o doble clic)
    // puntuaba dos veces la misma tarjeta antes de pasar a la siguiente.
    var rateBusy = false;
    async function rateCurrent(name, btn) {
      if (rateBusy || !S.current) return;
      rateBusy = true;
      try {
        if (btn) btn.classList.add("pressed");
        var ok = await rate(S.current.key, name);
        if (!ok) { if (btn) btn.classList.remove("pressed"); return; } // no se guardó: sigue la misma tarjeta para volver a valorarla
        var si = streakInfo(true);
        if (si.count === si.goal) toast("Meta de hoy cumplida · " + si.cur + (si.cur === 1 ? " día" : " días") + " de racha");
        pickNext(); render();
      } finally { rateBusy = false; }
    }
    // Deshace los últimos repasos de esta sesión, de uno en uno (Z). Solo si la tarjeta sigue como la dejó ese repaso.
    async function undoLast() {
      if (rateBusy) return;
      var u = S.undo[S.undo.length - 1];
      if (!u || u.code !== S.lang) return;
      rateBusy = true;
      try {
        var why = "";
        var ok = await commit(function (b) {
          var id = u.key.split(":")[0], cur = b.review[u.key];
          if (!b.deck.some(function (e) { return e.id === id; })) { why = "La palabra ya no existe."; return false; }
          if (!cur || cardTime(cur) !== u.after) { why = "La tarjeta ha cambiado desde entonces."; return false; }
          if (u.prev) b.review[u.key] = JSON.parse(u.prev); else delete b.review[u.key];
          b.stats.reviewsTotal = Math.max(0, b.stats.reviewsTotal - 1);
          b.stats.byDay[u.day] = (b.stats.byDay[u.day] || 0) - 1; if (b.stats.byDay[u.day] <= 0) delete b.stats.byDay[u.day];
          if (u.wasNew) { var nk = u.day + ":" + u.mode; b.stats.newByDay[nk] = (b.stats.newByDay[nk] || 0) - 1; if (b.stats.newByDay[nk] <= 0) delete b.stats.newByDay[nk]; }
          var last = b.log[b.log.length - 1];
          if (last && last[0] === u.row[0] && last[1] === u.row[1]) b.log.pop();
        });
        if (!ok) {
          if (why) S.undo.pop(); // ese repaso ya no se puede deshacer
          toast(why ? "No se puede deshacer. " + why : "No se pudo deshacer. Reintenta.", true);
          if (why) render();
          return;
        }
        S.undo.pop();
        S.tab = "estudiar"; S.studyAhead = false; S.showSentence = S.autoSentence;
        if (modeEnabled(u.mode)) { S.mode = u.mode; S.current = { key: u.key, entry: findEntry(u.key.split(":")[0]) }; S.flipped = true; }
        else S.current = null;
        render(); toast("Repaso deshecho");
      } finally { rateBusy = false; }
    }

    // ---- copia de seguridad ----
    function download(filename, text, mime) {
      try {
        var blob = new Blob([text], { type: mime || "application/octet-stream" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        setTimeout(function () { document.body.removeChild(a); }, 120);
        setTimeout(function () { URL.revokeObjectURL(url); }, 30000); // Safari puede tardar en empezar a descargar: soltar el enlace enseguida cancelaba copias grandes
        return true;
      } catch (e) { return false; }
    }
    function stamp() { var d = new Date(); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
    function exportJSON() {
      var ok = download("vocabulando-" + S.lang + "-" + stamp() + ".json", stringifyLang(S.lang), "application/json");
      toast(ok ? "Copia descargada" : "El navegador bloqueó la descarga.", !ok);
    }
    // una sola descarga con todos los idiomas (lo que importJSON reparte de nuevo): para navegadores que no escriben en carpetas
    var K_BACKUP = "vocabulando:lastBackup";
    function exportAll() {
      var langs = {}, n = 0;
      LANGS.forEach(function (l) { var b = peekBucket(l.code); if (b && b.deck.length) { langs[l.code] = b; n++; } });
      if (!n) { toast("Aún no hay palabras que guardar."); return; }
      var ok = download("vocabulando-todo-" + stamp() + ".json", JSON.stringify({ app: "vocabulando", version: 2, savedAt: new Date().toISOString(), languages: langs }), "application/json");
      if (ok) lsSet(K_BACKUP, String(Date.now()));
      toast(ok ? "Copia descargada (" + n + (n === 1 ? " idioma" : " idiomas") + ")" : "El navegador bloqueó la descarga.", !ok);
      renderBanners();
    }
    function backupNote() {
      var t = parseInt(lsGet(K_BACKUP), 10);
      if (!t) return "Aún no has guardado ninguna copia.";
      var d = Math.floor((Date.now() - t) / 86400000);
      return "Última copia: " + (d < 1 ? "hoy" : d === 1 ? "ayer" : "hace " + d + " días") + ".";
    }
    function csvCell(s) { s = String(s == null ? "" : s); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
    function exportCSV() {
      var rows = [["palabra_es", "palabra_" + S.lang, "frase_es", "frase_" + S.lang, "genero", "genero_es"]];
      S.deck.forEach(function (e) { rows.push([e.esWord, e.deWord, e.esSent || "", e.deSent || "", genderInfo(e).g, esGenderInfo(e).g]); });
      var csv = rows.map(function (r) { return r.map(csvCell).join(";"); }).join("\n");
      var ok = download("vocabulando-" + S.lang + "-" + stamp() + ".csv", "﻿" + csv, "text/csv;charset=utf-8");
      toast(ok ? "CSV descargado" : "El navegador bloqueó la descarga.", !ok);
    }
    // acepta: copia o archivo de un idioma (v2, lleva "lang"), el archivo con todos los idiomas ("languages": se reparte entre ellos)
    // y las copias antiguas sin idioma (→ el que diga el nombre del archivo, italiano.json…, o si no el idioma abierto).
    // Admite varios archivos a la vez y también los de una carpeta elegida entera (sin mirar sus subcarpetas).
    function langOfFile(name) { var n = String(name || "").toLowerCase(); for (var i = 0; i < LANGS.length; i++) if (n === LANGS[i].file + ".json") return LANGS[i].code; return null; }
    async function importJSON(files) {
      try {
        files = Array.prototype.slice.call(files && files.name ? [files] : (files || []));
        var plan = {};
        for (var fi = 0; fi < files.length; fi++) {
          var f = files[fi], rel = f.webkitRelativePath || "";
          if (rel && (rel.split("/").length > 2 || !/\.json$/i.test(f.name))) continue; // de una carpeta: solo sus .json, no los de las subcarpetas
          var data = null;
          try { data = JSON.parse(await f.text()); } catch (e) { continue; }
          var got = [];
          if (data && data.languages && typeof data.languages === "object") {
            Object.keys(data.languages).forEach(function (c) { if (LANG_BY[c] && data.languages[c]) got.push([c, data.languages[c]]); });
          } else {
            var incoming = Array.isArray(data) ? data : (data && Array.isArray(data.deck) ? data.deck : null);
            var c0 = data && LANG_BY[data.lang] ? data.lang : (langOfFile(f.name) || S.lang);
            if (incoming && c0) got.push([c0, { deck: incoming, review: data && data.review, stats: data && data.stats, log: data && data.log }]);
          }
          got.forEach(function (g) { (plan[g[0]] = plan[g[0]] || []).push(g[1]); });
        }
        var codes = Object.keys(plan);
        if (!codes.length) { toast(files.length > 1 ? "No hay ningún mazo válido en lo que has elegido." : "El archivo no tiene un mazo válido.", true); return; }
        var added = 0, skipped = 0, updated = 0, any = false, nothing = false;
        // Fusión sin pérdidas: se añade lo que falta y, de las tarjetas que ya existen, gana el repaso más reciente (así sirve para
        // pasar el progreso de un dispositivo a otro). Una palabra con la misma pareja que otra de distinto id se considera repetida.
        var ok = await commit(function () {
          codes.forEach(function (c) {
            plan[c].forEach(function (incomingBucket) {
              var b = bucket(c), src = normBucket(incomingBucket);
              var pair = function (e) { return normDup(e.esWord) + "|" + normDup(e.deWord); };
              var byId = {}, byPair = {}, drop = {};
              b.deck.forEach(function (e) { byId[e.id] = 1; byPair[pair(e)] = e.id; });
              src.deck = src.deck.filter(function (e) {
                var p = pair(e);
                if (!byId[e.id] && byPair[p] && byPair[p] !== e.id) { skipped++; drop[e.id] = 1; return false; }
                if (!byId[e.id]) byPair[p] = e.id;
                return true;
              });
              Object.keys(src.review).forEach(function (k) { if (drop[k.split(":")[0]]) delete src.review[k]; });
              var upd = 0;
              Object.keys(src.review).forEach(function (k) { if (b.review[k] && cardTime(src.review[k]) > cardTime(b.review[k])) upd++; });
              var merged = mergeBucket(b, src), addedC = merged.deck.length - b.deck.length;
              var changed = addedC > 0 || upd > 0 || merged.stats.reviewsTotal !== b.stats.reviewsTotal || merged.log.length !== b.log.length;
              if (!changed) return;
              DATA.languages[c] = merged; added += addedC; updated += upd; any = true;
            });
          });
          if (!any) { nothing = true; return false; }
        }, codes);
        if (nothing) { toast("No hay nada nuevo: ya estaba todo en el mazo" + (skipped ? " (" + skipped + " repetida" + (skipped === 1 ? "" : "s") + ")" : "") + "."); render(); if (!S.lang) buildPicker(); return; }
        if (!ok) { toast("No se pudo guardar. Reintenta.", true); return; }
        render(); if (!S.lang) buildPicker();
        var parts = [];
        if (added) parts.push(added + " añadida" + (added === 1 ? "" : "s"));
        if (updated) parts.push(updated + " repaso" + (updated === 1 ? "" : "s") + " actualizado" + (updated === 1 ? "" : "s"));
        if (!parts.length) parts.push("Estadísticas actualizadas");
        if (skipped) parts.push(skipped + " ya estaba" + (skipped === 1 ? "" : "n"));

      return '<div class="modal-top"><h2 class="modal-title" id="infoTitle">Cómo funciona Vocabulando</h2><button type="button" class="modal-x" id="infoClose" aria-label="Cerrar">×</button></div>' +
        '<div class="info-body">' +
        "<p>Vocabulando es un cuaderno de vocabulario con tarjetas de repaso espaciado. Cada idioma tiene su propio mazo de palabras y frases, con sus repasos y estadísticas. Con el chip del idioma (arriba) cambias de idioma sin pasar por la pantalla de inicio, y con el nombre «Vocabulando» vuelves a ella." + (sibShow ? " El botón con el logo (junto al del tema) te lleva a Conjugario (conjugaciones), a Declinario (declinaciones y pronombres) o a Mundario (números, hora, países…), en el mismo idioma." : "") + "</p>" +
        "<h3>Crear</h3><ul>" +
        "<li>Escribe la palabra en español: debajo del campo del idioma aparecen <b>traducciones sugeridas</b> del Wikcionario. Púlsalas para rellenar el campo, o escribe tú la palabra.</li>" +
        "<li>Cada campo de palabra lleva a la izquierda un botón de <b>género</b> (♂ ♀ neutro, ambiguo o ninguno), también el del español. Se detecta solo por el artículo («der Spiegel», «el coche») o consultando el Wikcionario, y también puedes elegirlo tú. La palabra se colorea —y también donde aparece en la frase—: azul masculino, rojo femenino, verde neutro, morado ambiguo; así ves de un vistazo si el género coincide en los dos idiomas. Si guardas un sustantivo sin su artículo se te avisa: se memoriza mejor con él.</li>" +
        "<li>El botón <b>Sugerir frases</b> (la burbuja dentro de la oración en español) trae frases reales de Tatoeba que contienen la palabra y, si has rellenado las dos palabras, solo las que la usan con el significado de tu traducción (si Tatoeba falla o no tiene la palabra, ejemplos del Wikcionario, con traducción al inglés: el español se traduce solo al elegirlos); el botón <b>Traducir</b> (icono de idiomas, aparece en la oración que está vacía) traduce la que hayas escrito (MyMemory). Las traducciones automáticas pueden fallar: revísalas antes de guardar. En portugués se avisa de las frases con rasgos de Brasil. Las oraciones se guardan sin el punto final (se conservan «…», «?», «!» y los signos combinados).</li>" +
        "<li>El botón ✨ abre ChatGPT con una petición que se adapta a lo que hayas rellenado: con una sola palabra, la traduce y propone una frase; con las dos, genera una frase con ese significado concreto; con oraciones, las traduce o revisa la traducción. Al pasar el ratón ves qué va a pedir.</li></ul>" +
        "<h3>Mazo</h3><ul>" +
        "<li>Aquí está la lista completa de tus palabras y frases. El buscador no distingue mayúsculas ni acentos (escribir «uber» encuentra «über») y, si lo dejas marcado, mira también dentro de las frases. Puedes escribir varias palabras: salen las entradas que las llevan todas.</li>" +
        "<li>Filtros: por estado (nuevas, en aprendizaje, en repaso o que ya toca repasar), por tener o no frase y por género. Orden: más recientes o antiguas, alfabético (sin contar el artículo, así «der Apfel» va en la A), por próximo repaso o por las que más fallas.</li>" +
        "<li>El lápiz lleva a Crear con la entrada cargada; al guardar o cancelar vuelves a la lista, en el mismo punto. La × borra (pide confirmación), «frase» abre la oración y el altavoz la pronuncia. El <b>+</b> añade esa entrada a otro idioma: eliges uno en el que todavía no esté y se abre Crear en él con la palabra española, su frase y su género ya puestos y, si hay conexión, la traducción de la palabra (Wikcionario) y de la frase (MyMemory) como propuesta. No se guarda nada hasta que pulses «Guardar»: lo revisas, lo cambias y, al guardar o cancelar, vuelves al idioma, la pestaña y el punto en que estabas (la lista con sus filtros y su posición, o Estudiar con el mismo modo). Está también en la tarjeta de Estudiar. En Crear, bajo el formulario, quedan las últimas 5 añadidas para comprobar lo que acabas de guardar.</li>" +
        "<li>El botón <b>IPA</b> (en cada fila de Mazo y en la tarjeta de Estudiar, cuando ya ves la respuesta) consulta <b>en ese momento</b> en Wiktionary la transcripción fonética de la palabra del idioma: fonémica entre barras /…/ y fonética entre corchetes […]. Enseña la pronunciación <b>europea</b> (francés de Francia y no de Quebec, portugués de Portugal y no de Brasil, inglés británico y no americano…) y dice qué variantes ha dejado fuera. El inglés se transcribe en el <b>SSB</b> (Standard Southern British) en el sistema de Geoff Lindsey, el de <b>CUBE</b>: se convierte desde el RP de Wiktionary y el enlace «(CUBE)» deja comprobar la palabra en su diccionario. Si Wiktionary solo trae una no europea, la muestra avisando. Si la palabra lleva varias formas («der Mann / der Kerl»), salen todas. Si Wiktionary no trae la transcripción (una frase, una forma flexionada, un compuesto largo…), se prueba <b>palabra a palabra</b> y, donde falte, se calcula una <b>aproximada con las reglas de pronunciación</b> del idioma (se avisa de que no es la de un diccionario; en inglés no se puede deducir de la ortografía). La transcripción se ve en fucsia y entre paréntesis queda el enlace a la entrada. No se guarda: se pide de nuevo al volver a abrir la página.</li></ul>" +
        "<h3>Estudiar</h3>" +
        "<p>Se muestra la palabra (o la frase) en español, pulsas «Mostrar respuesta» y la valoras con <i>Otra vez, Difícil, Bien</i> o <i>Fácil</i>. La app programa el siguiente repaso con el algoritmo FSRS: cuanto mejor la sabes, más tarde vuelve. Las tarjetas con plazo de días tocan desde las 4:00 de su día, y el día nuevo (también para los contadores de Actividad) empieza a las 4:00: lo que repases de madrugada cuenta como el día anterior. El número junto a la pestaña Estudiar (y el de «por repasar» en cada idioma de la pantalla inicial) son las tarjetas que ya tocan: no cuenta las nuevas, ni las pausadas, ni los modos que no tengas activados. Hay dos modos, Palabras y Frases (y, si lo activas, Inversa: del idioma al español). Atajos: punto o espacio para mostrar la respuesta; J, K, L, Ñ (o 0, 1, 2, 3) para valorar; Z para deshacer el último repaso; P para oír la pronunciación.</p>" +
        "<ul>" +
        "<li><b>Palabras y frases nuevas por día:</b> en la propia pestaña Estudiar eliges cuántas palabras nuevas y cuántas frases nuevas se te ofrecen cada día (por defecto 20 y 10, o sin límite); el resto espera su turno. «Inversa» usa el límite de palabras. Si te quedas con ganas, el botón «Estudiar nuevas más» añade 10. Los repasos que toquen salen siempre.</li>" +
        "<li><b>Deshacer</b> (Z o el botón «Deshacer») anula los últimos repasos de esta sesión, de uno en uno, mientras sigas en este idioma.</li>" +
        "<li><b>Pronunciación:</b> usa una voz de tu navegador o de tu sistema <b>con acento europeo</b> (francés de Francia y no de Canadá, portugués de Portugal y no de Brasil, inglés británico y no americano…). Si no hay ninguna para el idioma, no aparecen los botones de audio: en Actividad, en «Voces», ves qué voz se usa en cada idioma, qué falta y cómo instalarla. Con el interruptor «usar la que haya» puedes permitir también voces de otros acentos.</li>" +
        "<li><b>Escribir la respuesta:</b> en Actividad puedes activar que, en Palabras, teclees la traducción en vez de mostrarla. Se corrige sin que importen las mayúsculas ni los acentos (te dice «casi» si fallan) y se acepta cualquiera de las alternativas separadas por «/». Te sugiere la valoración (Bien si acierta, Difícil si casi, Otra vez si no), pero la eliges tú. «No lo sé» la muestra sin corregir.</li>" +
        "<li><b>Hueco:</b> en Actividad puedes activar «frases con hueco»: se muestra tu frase en " + "el idioma con la palabra de la ficha tapada (y su traducción como pista) y escribes la palabra que falta, con la forma que lleva en la frase. Solo salen las frases en las que se localiza la palabra. Es recordar la palabra en contexto, que se retiene mejor que la tarjeta suelta. Se corrige como «escribir la respuesta» y sugiere la valoración.</li>" +
        "<li><b>Dictado:</b> también en Actividad (si tu navegador tiene voz para el idioma): suena una de tus frases y la escribes entera. Se compara palabra por palabra, sin que importen la puntuación ni la mayúscula inicial; las palabras que fallas se subrayan. «Más despacio» la repite más lenta y la tecla P la repite.</li>" +
        "<li><b>En tus otros idiomas:</b> al mostrar la respuesta, y con el botón «idiomas» de cada fila de Mazo, ves cómo tienes guardada esa misma palabra española en tus otros idiomas. Sirve para notar parecidos y no confundir francés, italiano, portugués o catalán.</li>" +
        "<li><b>Pausar:</b> el botón de pausa de la tarjeta (y el de cada fila de Mazo) aparta una entrada: no sale al estudiar ni cuenta en la previsión hasta que la reanudas. Las que te fallan mucho (" + LEECH + " veces o más) se marcan como «difíciles» en Mazo, con su filtro, y al mostrarte una te sugiere cambiarla o pausarla.</li>" +
        "<li><b>Racha:</b> cuenta los días en que llegas a tu meta diaria (10 repasos por defecto, se cambia en Actividad), sumando todos los idiomas. Un día suelto sin llegar a la meta se perdona (uno por semana). La pantalla de elegir idioma la muestra junto a las tarjetas que tocan en cada idioma.</li>" +
        "<li><b>Actividad</b> empieza por «Hoy»: qué toca en cada idioma (con enlace para estudiarlo) y un resumen de Conjugario, y muestra además la retención de los últimos 30 días y cuántos repasos vencen en los próximos 7.</li></ul>" +
        "<h3>Dónde se guardan tus datos</h3>" +
        '<div class="info-status"><i class="sdot' + (ok ? " ok" : "") + '"></i><span>' + status + "</span></div>" +
        "<p>Tus palabras, frases y el estado de cada repaso se guardan en una <b>carpeta de tu disco que eliges tú</b>, con un archivo por idioma: " + esc(files) + ". Cada palabra nueva o repaso se escribe al instante. Son archivos de texto (JSON): puedes copiarlos como copia de seguridad o guardarlos en una carpeta de OneDrive.</p>" +
        "<p>El navegador solo conserva una copia de apoyo, de modo que <b>borrar la caché no pierde nada</b>: vuelves a elegir la carpeta y todo reaparece. Esto funciona en Chrome y Edge de escritorio; el permiso sobre la carpeta puede pedirse de nuevo al abrir una sesión nueva. En Actividad puedes cambiar de carpeta, exportar e importar copias.</p>" +
        "<h3>En Safari (Mac, iPad) y en el móvil</h3>" +
        "<p>Safari no puede guardar en una carpeta: tus datos se quedan en el propio navegador y Safari puede borrarlos si no visitas la web en mucho tiempo. En el iPad o el móvil, abre la web publicada y usa «Añadir a pantalla de inicio»: funciona sin conexión y Safari no borra sus datos por falta de uso. En el Mac, lo más cómodo es usar Chrome o Edge (guardan en una carpeta); con Safari, añade la web al Dock (Archivo › Añadir al Dock, desde Safari 17), pulsa «Cargar mazos» en el aviso de arriba y elige tu carpeta de mazos para traer tus idiomas, y «Guardar copia» de vez en cuando (un solo archivo con todos). Para pasar tu progreso entre dispositivos usa Guardar copia (o Exportar JSON) e Importar JSON en Actividad: al importar se fusiona (se quedan los repasos más recientes), no se pierde nada. También puedes importar listas de palabras pegando texto o un CSV.</p>" +
        "<h3>Qué sale de tu navegador</h3>" +

    var ART_EXAMPLE = { fr: { m: "un", f: "une" }, it: { m: "un", f: "una" }, ca: { m: "un", f: "una" }, pt: { m: "o", f: "a" }, de: { m: "der", f: "die", n: "das" }, el: { m: "ο", f: "η", n: "το" } };

    function entryState(e, now) { // lo que dicen sus tarjetas (palabra, frase e inversa) que ya se han empezado a estudiar

    // ---- pronunciación: voces del propio navegador (la app no envía nada a internet para esto) ----

    var VOICE_EU = {

    function retention30() { // de los repasos de tarjetas ya en repaso (no nuevas ni en aprendizaje), qué parte no fue «Otra vez»

    // qué voz se usa en cada idioma: solo con acento europeo (francés de Francia, portugués de Portugal, inglés británico…)
    function voicesHtml() {

        });

        var f = JSON.parse(lsGet("conjugario:fallos") || "null");

<style>
  :root {
    --paper: #E7EAF0;
    --card: #FFFFFF;
    --ink: #14202E;
    --muted: #64707F;
    --bg-top: #EEF1F6;
    --line: #D4DAE3;
    --accent: #2748D6;
    --accent-soft: #E7ECFC;
    --again: #CC4436;
    --hard: #B0741A;
    --good: #2748D6;
    --easy: #17936F;
    --der: #2C57E0;
    --die: #D23B2E;
    --das: #1F9D6B;
    --neutral: #2A3746;
    --warn: #E08A1E;
    --toast-bg: #14202E;
    --toast-fg: #FFFFFF;
    --radius: 14px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
  }

  body {
    background:
      radial-gradient(120% 90% at 50% -10%, var(--bg-top) 0%, var(--paper) 55%) fixed;
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
    transition: background .25s ease, color .25s ease;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 28px 20px 72px;
  }

  /* ---- topbar ---- */
  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
  }

  .brand-mark {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -.02em;
    line-height: 1;
    display: block;
  }

  .brand-mark .dot {
    color: var(--accent);
  }

  .brand-sub {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
    display: block;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: #DEE3EC;
    padding: 4px;
    border-radius: 999px;
  }

  .tab {
    border: 0;
    background: transparent;
    cursor: pointer;
    padding: 8px 16px;
    border-radius: 999px;
    font-family: "Inter";
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
  }

  .tab.is-active {
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(20, 32, 46, .12);
  }

  .top-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .theme-btn {
    width: 38px;
    height: 38px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .theme-btn:hover {
    border-color: var(--accent);
  }

  /* ---- panels ---- */
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 18px;
  }

  .panel-title {
    font-family: "Bricolage Grotesque";
    font-weight: 700;
    font-size: 17px;
    margin: 0 0 16px;
    letter-spacing: -.01em;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  .panel-head .panel-title {
    margin: 0;
  }

  .gemini-btn {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gemini-btn:hover {
    border-color: var(--accent);
  }

  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }

  .field {
    display: flex;
    flex-direction: column;
  }

  .lab {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }

  .lab .opt {
    text-transform: none;
    letter-spacing: 0;
    opacity: .7;
  }

  .in {
    font-family: "Inter";
    font-size: 16px;
    color: var(--ink);
    background: #F7F9FC;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 13px;
    width: 100%;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }

  .in::placeholder {
    color: #9AA6B4;
  }

  .in:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .in.is-dup,
  .in.is-dup:focus {
    border-color: var(--warn);
    background: #FFF7EE;
    box-shadow: 0 0 0 3px rgba(224, 138, 30, .18);
  }

  .dup-warn {
    display: none;
    font-size: 12.5px;
    color: var(--warn);
    font-weight: 500;
    margin: -4px 2px 14px;
  }

  .dup-warn.show {
    display: block;
  }

  .btn {
    font-family: "Inter";
    font-weight: 600;
    font-size: 15px;
    border-radius: 11px;
    cursor: pointer;
    border: 1px solid transparent;
    padding: 12px 18px;
    transition: transform .08s, filter .15s, background .15s;
  }

  .btn:active {
    transform: translateY(1px);
    filter: brightness(.95);
  }

  .btn-ghost:active {
    background: var(--accent-soft);
  }

  .btn-danger {
    background: var(--again);
    color: #fff;
  }

  .btn-danger:hover {
    filter: brightness(1.06);
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    width: 100%;
  }

  .btn-primary:hover {
    filter: brightness(1.06);
  }

  .btn-primary:disabled {
    opacity: .55;
    cursor: default;
  }

  .btn-ghost {
    background: transparent;
    border-color: var(--line);
    color: var(--ink);
  }

  .btn-ghost:hover {
    background: #F1F4F9;
  }

  .btn-gonzalo {
    background: var(--der);
  }

  .btn-maria {
    background: var(--die);
  }

  .hint {
    font-size: 12.5px;
    color: var(--muted);
    margin: 12px 2px 0;
  }

  /* ---- deck list ---- */
  .deck-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .deck-head .panel-title {
    margin: 0;
  }

  .deck-count {
    font-family: "IBM Plex Mono";
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .06em;
  }

  .deck-head-right {

  .pick-streak { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: calc(8 * var(--u)) calc(30 * var(--u)); margin-top: calc(26 * var(--u)); font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: calc(18 * var(--u)); color: var(--p-muted); }

  /* ---- pausar y entradas difíciles ---- */
  .k-pause { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 7px; line-height: 0; }
  .k-pause svg { width: 21px; height: 21px; }

  .pause { border: 0; background: transparent; color: #AEB8C5; cursor: pointer; padding: 3px 6px; border-radius: 7px; line-height: 0; }

  /* ---- Karteikarte (elemento firma) ---- */
  .karte {

  .karte::after {

  .switch-track {
    width: 34px;

    border-radius: 999px;
    background: #CBD3DE;
    position: relative;
    transition: background .18s;
  }

  .switch-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(20, 32, 46, .3);

    font-size: 13.5px;
    line-height: 1.45;
  }

  .diag-row .sdot {
    margin-top: 6px;
  }

  .diag-note {
    margin-top: 8px;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--muted);
  }

  .art-hint {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 2px 10px;
    margin-top: 8px;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--warn);
  }

  .art-hint[hidden] {
    display: none;
  }

  .art-hint .link-btn {
    margin: 0;
    font-size: 12.5px;
  }

  .sent-note {
    padding: 6px 2px 0;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--muted);
  }

  .sent-empty {
    padding: 8px 2px 2px;
    font-size: 13.5px;
    color: var(--muted);
  }

  .in {
    line-height: 22px;
  }

  /* frases: filas completas, cuadros que crecen con el texto */
  .field-grid.stack {
    grid-template-columns: 1fr;
  }

  textarea.in {
    display: block;
    resize: none;
    overflow: hidden;
  }

  .hl-wrap {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #F7F9FC;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }

  body.theme-dark .hl-wrap {
    background: #0F1721;
  }

  .hl-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .hl-back {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 11px 13px;
    font-family: "Inter", sans-serif;
    font-size: 16px;
    line-height: 22px;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    color: var(--ink);
    pointer-events: none;
  }

  .hl-wrap .hl-in,
  .hl-wrap .hl-in:focus {
    position: relative;
    border: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    color: transparent;
    caret-color: var(--ink);
  }

  .hl-in::selection {
    background: rgba(91, 121, 240, .35);
    color: transparent;
  }

  /* ayuda */
  .modal-lg {
    max-width: 640px;
    max-height: min(86vh, 820px);
    overflow: auto;
    padding: 22px 26px 26px;
  }

  .modal-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .modal-top .modal-title {
    margin: 0;
    font-size: 20px;
  }

  .modal-x {
    padding: 0 6px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
  }

  .modal-x:hover {
    color: var(--ink);
  }

  .info-body h3 {
    margin: 22px 0 6px;
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
  }

  .info-body p,
  .info-body li {
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink);
  }

  .info-body p {
    margin: 8px 0 0;
  }

  .info-body ul {
    margin: 4px 0 0;
    padding-left: 20px;
  }

  .info-body li {
    margin: 5px 0;
  }

  .info-body .muted-note,
  .info-body .muted-note a {
    color: var(--muted);
  }

  .info-status {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin: 4px 0 0;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
  }

  .info-status .sdot {
    margin-top: 6px;
  }

  body.modal-open {
    overflow: hidden;
  }

  @media (max-width:760px) {
    .topbar {
      flex-wrap: wrap;
    }

    .top-right {
      flex-wrap: wrap;
    }
  }

  a.brand-mark {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: opacity .15s;
  }

  a.brand-mark:hover {
    opacity: .75;
  }

  a.brand-mark:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 6px;
  }

  .sent-error {
    color: var(--ink);
    line-height: 1.5;
  }

  .databar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 14px;
    margin: 0 0 18px;
    padding: 12px 14px;
    border: 1px solid var(--warn);
    border-radius: 12px;
    background: rgba(224, 138, 30, .13);
    font-size: 13.5px;
    line-height: 1.4;
  }

  .databar-txt {
    flex: 1 1 240px;
    min-width: 0;
  }

  .databar-act {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .btn-sm {
    width: auto;
    font-size: 13px;
    padding: 8px 13px;
    border-radius: 9px;
  }

  .databar-x {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    padding: 0 4px;
  }

  .data-line {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0 0 14px;
    font-size: 14px;
  }

  .data-line b {
    font-weight: 600;
    word-break: break-all;
  }

  .sdot {
    flex: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--warn);
  }

  .sdot.ok {
    background: var(--easy);
  }

  @media (max-width:1180px) {
    :root {

    }

    .pick-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

      margin-bottom: 26px;
    }

    .pick-top {
      gap: 10px;
    }

    .pick-title {
      font-size: 27px;
    }

    .pick-btns {
      gap: 8px;

    }

        if (f.lastModified === fl.lastModified) return false;
        var b = parseLang(await f.text(), code);
        fl.lastModified = f.lastModified;
        if (!b) { F.err[code] = "invalid"; renderBanners(); return false; } // se rompió desde fuera: no se toca
        var wasBad = !!F.err[code], dirty = isDirty(code);

      }
    }

    // Todas las lecturas y escrituras pasan por aquí, de una en una: releer archivo → aplicar cambio → guardar.
    var chain = Promise.resolve();
    function commit(fn, codes) {
      codes = codes || [S.lang];
      var cur = S.lang;
      var run = chain.then(async function () {
        for (var i = 0; i < codes.length; i++) { if (!loaded[codes[i]]) await doLoad(codes[i]); await refreshIfChanged(codes[i]); }
        // copia para deshacer solo de los idiomas que van a cambiar (no de todos los abiertos en la sesión)
        var snap = {};
        codes.forEach(function (c) { if (DATA.languages[c]) snap[c] = JSON.stringify(DATA.languages[c]); });
        if (fn(bucket(cur)) === false) { bindLang(); return false; }
        bindLang();
        var ok = true;
        for (var j = 0; j < codes.length; j++) { if (!(await persistLang(codes[j]))) ok = false; }
        if (!ok) { Object.keys(snap).forEach(function (c) { DATA.languages[c] = JSON.parse(snap[c]); }); bindLang(); }
        return ok;

    }
    function loadLang(code) {
      var run = chain.then(function () { return doLoad(code); });
      chain = run.catch(function () { });
      return run;
    }

    // al conectar la carpeta: vuelca ya a sus archivos los idiomas con cambios sin guardar, para que no dependan de la caché
    async function flushPending() {

        var c = LANGS[i].code;

      }
    }
    async function connectDir(h) {

      F.state = "connected"; loaded = {};
      await idbSet("dir", h);
      if (S.lang) await loadLang(S.lang);
      if (F.state === "connected") await flushPending();
      bindLang(); renderBanners(); render();
      if (F.state === "connected") toast("Guardando en la carpeta «" + F.name + "»");
      else toast("No se pudo leer la carpeta. Elige otra.", true);

    }
    async function initFile() {
      if (!F.supported) { F.state = "unsupported"; return; }

      if (!h) { F.state = "none"; return; }

    async function pickFolder() {

    async function reconnect() {

    }
    function syncFromFile() {
      chain = chain.then(async function () {
        if (!S.lang || !loaded[S.lang]) return;
        if (!(await refreshIfChanged(S.lang))) return;
        bindLang();
        if (!formHasText()) render();
      }).catch(function () { });
    }

    // ---- altas, ediciones y repasos ----
    async function addEntry(v) {
      var id = uid();
      var ok = await commit(function (b) {
        var e = { id: id, esWord: v.esWord, deWord: v.deWord, esSent: v.esSent, deSent: v.deSent, createdAt: Date.now() };
        if (v.gender) e.gender = v.gender;
        if (v.autoGender) e.autoGender = v.autoGender;
        if (v.esGender) e.esGender = v.esGender;
        if (v.esAutoGender) e.esAutoGender = v.esAutoGender;

      return ok ? id : false;
    }
    async function updateEntry(id, v) {
      var ok = await commit(function (b) {
        var e = null; b.deck.forEach(function (x) { if (x.id === id) e = x; });
        if (!e) return false;
        if (e.deWord !== v.deWord) delete e.autoGender; // otra palabra: hay que volver a consultar
        if (e.esWord !== v.esWord) delete e.esAutoGender;
        e.esWord = v.esWord; e.deWord = v.deWord; e.esSent = v.esSent; e.deSent = v.deSent; e.updatedAt = Date.now();
        if (v.gender) e.gender = v.gender; else delete e.gender;
        if (v.autoGender) e.autoGender = v.autoGender;
        if (v.esGender) e.esGender = v.esGender; else delete e.esGender;
        if (v.esAutoGender) e.esAutoGender = v.esAutoGender;

    }
    async function deleteEntry(id) {
      S.undo = S.undo.filter(function (u) { return u.key.split(":")[0] !== id; });
      return commit(function (b) {
        b.deck = b.deck.filter(function (e) { return e.id !== id; });
        delete b.review[id + ":word"]; delete b.review[id + ":sentence"]; delete b.review[id + ":rev"];
      });
    }
    async function rate(key, ratingName) {
      var code = S.lang, rec = null;
      var ok = await commit(function (b) {
        var raw = b.review[key], card = raw ? reviveCard(raw) : FS.createEmptyCard(new Date());
        var wasNew = !raw || raw.state === FS.State.New, now = new Date(), day = dateKey(now.getTime()), mode = key.split(":")[1];
        var next = schedNext(card, FS.Rating[ratingName]);
        b.review[key] = next;
        b.stats.reviewsTotal += 1; b.stats.byDay[day] = (b.stats.byDay[day] || 0) + 1;
        if (wasNew) { var nk = day + ":" + mode; b.stats.newByDay[nk] = (b.stats.newByDay[nk] || 0) + 1; }
        var cut = dateKey(now.getTime() - 14 * 86400000); // de las nuevas por día solo interesan los últimos días
        Object.keys(b.stats.newByDay).forEach(function (k) { if (k.slice(0, 10) < cut) delete b.stats.newByDay[k]; });
        var row = [Math.floor(now.getTime() / 1000), key, FS.Rating[ratingName], wasNew ? 0 : raw.state];
        b.log.push(row); trimLog(b);
        rec = { code: code, key: key, prev: raw ? JSON.stringify(raw) : null, after: next.last_review.getTime(), wasNew: wasNew, day: day, mode: mode, row: row };
      });
      if (!ok) { toast("No se pudo guardar el repaso.", true); return false; }
      S.undo.push(rec); if (S.undo.length > 20) S.undo.shift();
      return true;
    }

    // Un repaso a la vez: con la carpeta conectada guardar tarda un instante y, sin este freno, una doble pulsación (o doble clic)
    // puntuaba dos veces la misma tarjeta antes de pasar a la siguiente.
    var rateBusy = false;
    async function rateCurrent(name, btn) {
      if (rateBusy || !S.current) return;
      rateBusy = true;
      try {
        if (btn) btn.classList.add("pressed");
        var ok = await rate(S.current.key, name);
        if (!ok) { if (btn) btn.classList.remove("pressed"); return; } // no se guardó: sigue la misma tarjeta para volver a valorarla
        var si = streakInfo(true);
        if (si.count === si.goal) toast("Meta de hoy cumplida · " + si.cur + (si.cur === 1 ? " día" : " días") + " de racha");
        pickNext(); render();
      } finally { rateBusy = false; }
    }
    // Deshace los últimos repasos de esta sesión, de uno en uno (Z). Solo si la tarjeta sigue como la dejó ese repaso.
    async function undoLast() {
      if (rateBusy) return;
      var u = S.undo[S.undo.length - 1];
      if (!u || u.code !== S.lang) return;
      rateBusy = true;
      try {
        var why = "";
        var ok = await commit(function (b) {
          var id = u.key.split(":")[0], cur = b.review[u.key];
          if (!b.deck.some(function (e) { return e.id === id; })) { why = "La palabra ya no existe."; return false; }
          if (!cur || cardTime(cur) !== u.after) { why = "La tarjeta ha cambiado desde entonces."; return false; }
          if (u.prev) b.review[u.key] = JSON.parse(u.prev); else delete b.review[u.key];
          b.stats.reviewsTotal = Math.max(0, b.stats.reviewsTotal - 1);
          b.stats.byDay[u.day] = (b.stats.byDay[u.day] || 0) - 1; if (b.stats.byDay[u.day] <= 0) delete b.stats.byDay[u.day];
          if (u.wasNew) { var nk = u.day + ":" + u.mode; b.stats.newByDay[nk] = (b.stats.newByDay[nk] || 0) - 1; if (b.stats.newByDay[nk] <= 0) delete b.stats.newByDay[nk]; }
          var last = b.log[b.log.length - 1];
          if (last && last[0] === u.row[0] && last[1] === u.row[1]) b.log.pop();
        });
        if (!ok) {
          if (why) S.undo.pop(); // ese repaso ya no se puede deshacer
          toast(why ? "No se puede deshacer. " + why : "No se pudo deshacer. Reintenta.", true);
          if (why) render();
          return;
        }
        S.undo.pop();
        S.tab = "estudiar"; S.studyAhead = false; S.showSentence = S.autoSentence;
        if (u.mode !== "rev" || S.revOn) { S.mode = u.mode; S.current = { key: u.key, entry: findEntry(u.key.split(":")[0]) }; S.flipped = true; }
        else S.current = null;
        render(); toast("Repaso deshecho");
      } finally { rateBusy = false; }
    }

    // ---- copia de seguridad ----
    function download(filename, text, mime) {
      try {
        var blob = new Blob([text], { type: mime || "application/octet-stream" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 120);
        return true;
      } catch (e) { return false; }
    }
    function stamp() { var d = new Date(); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
    function exportJSON() {
      var ok = download("vocabulando-" + S.lang + "-" + stamp() + ".json", stringifyLang(S.lang), "application/json");
      toast(ok ? "Copia descargada" : "El navegador bloqueó la descarga.", !ok);
    }
    function csvCell(s) { s = String(s == null ? "" : s); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
    function exportCSV() {
      var rows = [["palabra_es", "palabra_" + S.lang, "frase_es", "frase_" + S.lang, "genero", "genero_es"]];
      S.deck.forEach(function (e) { rows.push([e.esWord, e.deWord, e.esSent || "", e.deSent || "", genderInfo(e).g, esGenderInfo(e).g]); });
      var csv = rows.map(function (r) { return r.map(csvCell).join(";"); }).join("\n");
      var ok = download("vocabulando-" + S.lang + "-" + stamp() + ".csv", "﻿" + csv, "text/csv;charset=utf-8");
      toast(ok ? "CSV descargado" : "El navegador bloqueó la descarga.", !ok);
    }
    // acepta: copia o archivo de un idioma (v2, lleva "lang"), el archivo único de la versión anterior ("languages": se reparte
    // entre los archivos de cada idioma) y las copias antiguas sin idioma (→ el idioma abierto)
    async function importJSON(file) {
      try {
        var data = JSON.parse(await file.text()), plan = {};
        if (data && data.languages && typeof data.languages === "object") {
          Object.keys(data.languages).forEach(function (c) { if (LANG_BY[c] && data.languages[c]) plan[c] = data.languages[c]; });
        } else {
          var incoming = Array.isArray(data) ? data : (data && Array.isArray(data.deck) ? data.deck : null);
          if (incoming) plan[data && LANG_BY[data.lang] ? data.lang : S.lang] = { deck: incoming, review: data && data.review, stats: data && data.stats, log: data && data.log };
        }
        var codes = Object.keys(plan);
        if (!codes.length) { toast("El archivo no tiene un mazo válido.", true); return; }
        var added = 0, skipped = 0, updated = 0, any = false, nothing = false;
        // Fusión sin pérdidas: se añade lo que falta y, de las tarjetas que ya existen, gana el repaso más reciente (así sirve para
        // pasar el progreso de un dispositivo a otro). Una palabra con la misma pareja que otra de distinto id se considera repetida.
        var ok = await commit(function () {
          codes.forEach(function (c) {
            var b = bucket(c), src = normBucket(plan[c]);
            var pair = function (e) { return normDup(e.esWord) + "|" + normDup(e.deWord); };
            var byId = {}, byPair = {}, drop = {};
            b.deck.forEach(function (e) { byId[e.id] = 1; byPair[pair(e)] = e.id; });
            src.deck = src.deck.filter(function (e) {
              var p = pair(e);
              if (!byId[e.id] && byPair[p] && byPair[p] !== e.id) { skipped++; drop[e.id] = 1; return false; }
              if (!byId[e.id]) byPair[p] = e.id;
              return true;
            });
            Object.keys(src.review).forEach(function (k) { if (drop[k.split(":")[0]]) delete src.review[k]; });
            var upd = 0;
            Object.keys(src.review).forEach(function (k) { if (b.review[k] && cardTime(src.review[k]) > cardTime(b.review[k])) upd++; });
            var merged = mergeBucket(b, src), addedC = merged.deck.length - b.deck.length;
            var changed = addedC > 0 || upd > 0 || merged.stats.reviewsTotal !== b.stats.reviewsTotal || merged.log.length !== b.log.length;
            if (!changed) return;
            DATA.languages[c] = merged; added += addedC; updated += upd; any = true;
          });
          if (!any) { nothing = true; return false; }
        }, codes);
        if (nothing) { toast("No hay nada nuevo: ya estaba todo en el mazo" + (skipped ? " (" + skipped + " repetida" + (skipped === 1 ? "" : "s") + ")" : "") + "."); render(); return; }
        if (!ok) { toast("No se pudo guardar. Reintenta.", true); return; }
        render();
        var parts = [];
        if (added) parts.push(added + " añadida" + (added === 1 ? "" : "s"));
        if (updated) parts.push(updated + " repaso" + (updated === 1 ? "" : "s") + " actualizado" + (updated === 1 ? "" : "s"));
        if (!parts.length) parts.push("Estadísticas actualizadas");
        if (skipped) parts.push(skipped + " ya estaba" + (skipped === 1 ? "" : "n"));
        if (codes.length > 1) parts.push("en " + codes.length + " idiomas");
        toast(parts.join(" · "));
      } catch (e) {
        toast("No se pudo leer el archivo: " + (e && e.message ? e.message : "JSON inválido"), true);
      }
    }

    // ---- importar una lista de palabras (texto pegado o CSV) ----
    var listPlan = null;
    function splitDelim(line, d) { // un campo puede ir entre comillas ("a;b"; "" = comilla)
      var out = [], cur = "", q = false;
      for (var i = 0; i < line.length; i++) {
        var ch = line.charAt(i);
        if (q) { if (ch === '"') { if (line.charAt(i + 1) === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
        else if (ch === '"' && cur === "") q = true;
        else if (ch === d) { out.push(cur); cur = ""; }
        else cur += ch;
      }
      out.push(cur);
      return out.map(function (x) { return x.trim(); });
    }
    function parseList(text) {
      var lines = String(text || "").replace(/^﻿/, "").split(/\r?\n/).filter(function (l) { return l.trim() && l.trim().charAt(0) !== "#"; });
      var delims = ["\t", ";", "|", ","], d = ",";
      for (var i = 0; i < delims.length; i++) {
        var n = lines.filter(function (l) { return l.indexOf(delims[i]) >= 0; }).length;
        if (n && n >= lines.length / 2) { d = delims[i]; break; }
      }
      var rows = lines.map(function (l) { return splitDelim(l, d); });
      if (rows.length && /^(palabra_es|español|espanol|spanish)$/i.test(rows[0][0])) rows.shift(); // cabecera (también la de «Exportar CSV»)
      return rows;
    }
    function planList(text) {
      var rows = parseList(text), have = {}, seen = {}, out = [], dup = 0, bad = 0;
      S.deck.forEach(function (e) { have[normDup(e.esWord) + "|" + normDup(e.deWord)] = 1; });
      rows.forEach(function (r) {
        var es = (r[0] || "").trim(), de = (r[1] || "").trim();
        if (!es || !de) { bad++; return; }
        var k = normDup(es) + "|" + normDup(de);
        if (have[k] || seen[k]) { dup++; return; }
        seen[k] = 1;
        var es2 = noEndDot(r[2] || ""), de2 = noEndDot(r[3] || "");
        if (!es2 || !de2) { es2 = ""; de2 = ""; } // la frase necesita las dos versiones
        out.push({ es: es, de: de, esSent: es2, deSent: de2 });
      });
      return { rows: out, dup: dup, bad: bad, total: rows.length };
    }
    function listPreviewHtml(p) {
      if (!p.total) return '<div class="list-prev"><p>No hay ninguna línea que leer.</p></div>';
      var n = p.rows.length;
      var sample = p.rows.slice(0, 5).map(function (r) { return "<li><b>" + esc(r.es) + "</b> → " + esc(r.de) + "</li>"; }).join("");
      return '<div class="list-prev"><p><b>' + n + "</b> palabra" + (n === 1 ? "" : "s") + " nueva" + (n === 1 ? "" : "s") +
        (p.dup ? " · " + p.dup + " repetida" + (p.dup === 1 ? "" : "s") + " (se omiten)" : "") +
        (p.bad ? " · " + p.bad + " línea" + (p.bad === 1 ? "" : "s") + " sin las dos palabras (se omiten)" : "") + "</p>" +
        (n ? "<ul>" + sample + (n > 5 ? "<li>…</li>" : "") + '</ul><button class="btn btn-primary btn-sm" id="listAdd">Añadir ' + n + " palabra" + (n === 1 ? "" : "s") + "</button>" : "") + "</div>";
    }
    function checkList() {
      var ta = document.getElementById("listText"), pv = document.getElementById("listPrev");
      if (!ta || !pv) return;
      listPlan = planList(ta.value);
      pv.innerHTML = listPreviewHtml(listPlan);
    }
    async function addList() {
      if (!listPlan || !listPlan.rows.length) return;
      var rows = listPlan.rows, ids = [], skipped = 0;
      var ok = await commit(function (b) {
        var have = {}, used = {};
        b.deck.forEach(function (e) { have[normDup(e.esWord) + "|" + normDup(e.deWord)] = 1; used[e.id] = 1; });
        var t = Date.now();
        rows.forEach(function (r, i) {
          var k = normDup(r.es) + "|" + normDup(r.de);
          if (have[k]) { skipped++; return; }
          have[k] = 1;
          var id; do { id = uid(); } while (used[id]);
          used[id] = 1; ids.push(id);
          b.deck.push({ id: id, esWord: r.es, deWord: r.de, esSent: r.esSent, deSent: r.deSent, createdAt: t + i });
        });
        if (!ids.length) return false;
      });
      if (!ok) { toast(ids.length ? "No se pudo guardar. Reintenta." : "No había nada nuevo que añadir.", !!ids.length); return; }
      listPlan = null; render();
      toast(ids.length + " palabra" + (ids.length === 1 ? "" : "s") + " añadida" + (ids.length === 1 ? "" : "s") + (skipped ? " · " + skipped + " ya estaba" + (skipped === 1 ? "" : "n") : ""));
      if (S.autoGen && hasGender(S.lang)) detectGenders({ ids: ids });
    }

    // fetch con tiempo máximo: si un servicio externo no responde, la acción falla con aviso en lugar de quedarse "buscando" para siempre
    function fetchT(url, ms) {
      var c = new AbortController(), t = setTimeout(function () { c.abort(); }, ms || 15000);
      return fetch(url, { signal: c.signal }).finally(function () { clearTimeout(t); });
    }

    // ---- género automático (Wiktionary) ----
    // Si la palabra no lleva artículo ni género elegido, se consulta Wiktionary (API pública, solo se envía la palabra).
    // Se pinta solo si lo primero que lista Wiktionary para esa palabra es un sustantivo: así "doce" o "curto" (adjetivos) no se tiñen.
    var WIKT = "https://en.wiktionary.org/w/api.php";
    var WIKT_LANG = { fr: "French", it: "Italian", pt: "Portuguese", ca: "Catalan", pl: "Polish", de: "German", el: "Greek" };
    var POS_NAMES = /^(Noun|Proper noun|Verb|Adjective|Adverb|Pronoun|Numeral|Preposition|Postposition|Conjunction|Interjection|Article|Determiner|Particle|Participle|Contraction|Prefix|Suffix|Infix|Circumfix|Phrase|Proverb|Idiom|Letter|Symbol|Abbreviation|Initialism|Cardinal number|Ordinal number)$/;

    function wiktSection(text, name) {
      var m = new RegExp("(?:^|\\n)==\\s*" + name + "\\s*==[ \\t]*\\n").exec(text);
      if (!m) return "";
      var rest = text.slice(m.index + m[0].length), n = /\n==[^=]/.exec(rest);
      return n ? rest.slice(0, n.index) : rest;
    }
    function wiktBraced(text, from) { // plantilla {{…}} completa que empieza en `from` (admite plantillas anidadas)
      var depth = 0;
      for (var i = from; i < text.length - 1; i++) {

        if (two === "{{") { depth++; i++; }

        if (two === "}}" || two === "]]") { depth--; cur += two; i++; continue; }

    // géneros que declara una plantilla de cabecera ({{de-noun|m|…}}, {{pl-noun|m-in|…}}, {{pt-noun|mfbysense}}, {{head|xx|noun|g=f}}…)
    function wiktTemplateGenders(tpl, code) {

      parts.slice(1).forEach(function (p) {

        if (key && /^[a-z0-9_-]+$/i.test(key)) named[key] = p.slice(eq + 1).trim(); else pos.push(p.trim());
      });

        "<li>Cada campo de palabra lleva a la izquierda un botón de <b>género</b> (♂ ♀ neutro, ambiguo o ninguno), también el del español. Se detecta solo por el artículo («der Spiegel», «el coche») o consultando el Wikcionario, y también puedes elegirlo tú. La palabra se colorea —y también donde aparece en la frase—: azul masculino, rojo femenino, verde neutro, morado ambiguo; así ves de un vistazo si el género coincide en los dos idiomas. Si guardas un sustantivo sin su artículo se te avisa: se memoriza mejor con él.</li>" +
        "<li>El botón <b>Sugerir frases</b> (la burbuja dentro de la oración en español) trae frases reales de Tatoeba que contienen la palabra y, si has rellenado las dos palabras, solo las que la usan con el significado de tu traducción (si Tatoeba falla o no tiene la palabra, ejemplos del Wikcionario, con traducción al inglés: el español se traduce solo al elegirlos); el botón <b>Traducir</b> (icono de idiomas, aparece en la oración que está vacía) traduce la que hayas escrito (MyMemory). Las traducciones automáticas pueden fallar: revísalas antes de guardar. En portugués se avisa de las frases con rasgos de Brasil. Las oraciones se guardan sin el punto final (se conservan «…», «?», «!» y los signos combinados).</li>" +
        "<li>El botón ✨ abre ChatGPT con una petición que se adapta a lo que hayas rellenado: con una sola palabra, la traduce y propone una frase; con las dos, genera una frase con ese significado concreto; con oraciones, las traduce o revisa la traducción. Al pasar el ratón ves qué va a pedir.</li></ul>" +
        "<h3>Mazo</h3><ul>" +
        "<li>Aquí está la lista completa de tus palabras y frases. El buscador no distingue mayúsculas ni acentos (escribir «uber» encuentra «über») y, si lo dejas marcado, mira también dentro de las frases. Puedes escribir varias palabras: salen las entradas que las llevan todas.</li>" +
        "<li>Filtros: por estado (nuevas, en aprendizaje, en repaso o que ya toca repasar), por tener o no frase y por género. Orden: más recientes o antiguas, alfabético (sin contar el artículo, así «der Apfel» va en la A), por próximo repaso o por las que más fallas.</li>" +
        "<li>El lápiz lleva a Crear con la entrada cargada; al guardar o cancelar vuelves a la lista, en el mismo punto. La × borra (pide confirmación), «frase» abre la oración y el altavoz la pronuncia. En Crear, bajo el formulario, quedan las últimas 5 añadidas para comprobar lo que acabas de guardar.</li></ul>" +
        "<h3>Estudiar</h3>" +
        "<p>Se muestra la palabra (o la frase) en español, pulsas «Mostrar respuesta» y la valoras con <i>Otra vez, Difícil, Bien</i> o <i>Fácil</i>. La app programa el siguiente repaso con el algoritmo FSRS: cuanto mejor la sabes, más tarde vuelve. Las tarjetas con plazo de días tocan desde las 4:00 de su día, y el día nuevo (también para los contadores de Actividad) empieza a las 4:00: lo que repases de madrugada cuenta como el día anterior. Hay dos modos, Palabras y Frases (y, si lo activas, Inversa: del idioma al español). Atajos: punto o espacio para mostrar la respuesta; J, K, L, Ñ (o 0, 1, 2, 3) para valorar; Z para deshacer el último repaso; P para oír la pronunciación.</p>" +
        "<ul>" +
        "<li><b>Palabras y frases nuevas por día:</b> en la propia pestaña Estudiar eliges cuántas palabras nuevas y cuántas frases nuevas se te ofrecen cada día (por defecto 20 y 10, o sin límite); el resto espera su turno. «Inversa» usa el límite de palabras. Si te quedas con ganas, el botón «Estudiar nuevas más» añade 10. Los repasos que toquen salen siempre.</li>" +
        "<li><b>Deshacer</b> (Z o el botón «Deshacer») anula los últimos repasos de esta sesión, de uno en uno, mientras sigas en este idioma.</li>" +
        "<li><b>Pronunciación:</b> usa la voz que tenga tu navegador para el idioma. Si no hay ninguna, no aparecen los botones de audio.</li>" +
        "<li><b>Escribir la respuesta:</b> en Actividad puedes activar que, en Palabras, teclees la traducción en vez de mostrarla. Se corrige sin que importen las mayúsculas ni los acentos (te dice «casi» si fallan) y se acepta cualquiera de las alternativas separadas por «/». Te sugiere la valoración (Bien si acierta, Difícil si casi, Otra vez si no), pero la eliges tú. «No lo sé» la muestra sin corregir.</li>" +
        "<li><b>Pausar:</b> el botón de pausa de la tarjeta (y el de cada fila de Mazo) aparta una entrada: no sale al estudiar ni cuenta en la previsión hasta que la reanudas. Las que te fallan mucho (" + LEECH + " veces o más) se marcan como «difíciles» en Mazo, con su filtro, y al mostrarte una te sugiere cambiarla o pausarla.</li>" +
        "<li><b>Racha:</b> cuenta los días en que llegas a tu meta diaria (10 repasos por defecto, se cambia en Actividad), sumando todos los idiomas. Un día suelto sin llegar a la meta se perdona (uno por semana). La pantalla de elegir idioma la muestra junto a las tarjetas que tocan en cada idioma.</li>" +
        "<li><b>Actividad</b> muestra además la retención de los últimos 30 días y cuántos repasos vencen en los próximos 7.</li></ul>" +
        "<h3>Dónde se guardan tus datos</h3>" +
        '<div class="info-status"><i class="sdot' + (ok ? " ok" : "") + '"></i><span>' + status + "</span></div>" +
        "<p>Tus palabras, frases y el estado de cada repaso se guardan en una <b>carpeta de tu disco que eliges tú</b>, con un archivo por idioma: " + esc(files) + ". Cada palabra nueva o repaso se escribe al instante. Son archivos de texto (JSON): puedes copiarlos como copia de seguridad o guardarlos en una carpeta de OneDrive.</p>" +
        "<p>El navegador solo conserva una copia de apoyo, de modo que <b>borrar la caché no pierde nada</b>: vuelves a elegir la carpeta y todo reaparece. Esto funciona en Chrome y Edge de escritorio; el permiso sobre la carpeta puede pedirse de nuevo al abrir una sesión nueva. En Actividad puedes cambiar de carpeta, exportar e importar copias.</p>" +
        "<h3>En el iPad o el móvil</h3>" +
        "<p>Safari no puede guardar en una carpeta. Abre la web publicada y usa «Añadir a pantalla de inicio»: funciona sin conexión y Safari no borra sus datos por falta de uso. Para pasar tu progreso entre dispositivos usa Exportar JSON e Importar JSON en Actividad: al importar se fusiona (se quedan los repasos más recientes), no se pierde nada. También puedes importar listas de palabras pegando texto o un CSV.</p>" +
        "<h3>Qué sale de tu navegador</h3>" +
        "<p>Vocabulando no usa ningún servidor propio. Solo se consulta internet para ayudarte: el <b>Wikcionario</b> (la palabra en español que escribes, y la palabra del idioma para el género) y, únicamente cuando pulsas sus botones, <b>Tatoeba</b> y <b>MyMemory</b> (frases; si Tatoeba falla, ejemplos del Wikcionario). Las consultas automáticas se pueden apagar en Actividad.</p>" +
        '<div class="diag"><button type="button" class="btn btn-ghost btn-sm" id="diagBtn">Probar conexión</button><div id="diagOut" class="diag-out" aria-live="polite"></div></div>' +
        '<h3>Créditos</h3><p class="muted-note">Traducciones y géneros: <a href="https://es.wiktionary.org" target="_blank" rel="noopener">Wikcionario</a> (CC BY-SA). Frases: <a href="https://tatoeba.org" target="_blank" rel="noopener">Tatoeba</a> (CC BY 2.0 FR) y, de respaldo, ejemplos del <a href="https://en.wiktionary.org" target="_blank" rel="noopener">Wikcionario</a> (CC BY-SA). Traducción de frases: <a href="https://mymemory.translated.net" target="_blank" rel="noopener">MyMemory</a>. Repaso espaciado: FSRS.</p>' +

    // prueba de conexión: una petición mínima a cada servicio, para saber cuál responde y, si no, por qué
    async function runDiag() {

      out.innerHTML = rows.map(function (r) { return '<div class="diag-row"><i class="sdot' + (r[1] ? " ok" : "") + '"></i><span><b>' + esc(r[0]) + ":</b> " + esc(r[2]) + "</span></div>"; }).join("") +
        (navigator.onLine === false ? '<div class="diag-note">El navegador indica que no hay conexión a internet.</div>' : "") +
        '<div class="diag-note">' + (allOk ? "Todo responde: si algo falló antes, fue un corte puntual; vuelve a intentarlo." : "Si ninguno responde, revisa tu conexión, la VPN o el bloqueador de anuncios (prueba a desactivarlo en esta página). Si solo falla uno, es ese servicio.") + "</div>";

    var ART_EXAMPLE = { fr: { m: "un", f: "une" }, it: { m: "un", f: "una" }, ca: { m: "un", f: "una" }, pt: { m: "o", f: "a" }, de: { m: "der", f: "die", n: "das" }, el: { m: "ο", f: "η", n: "το" } };
    function startsWithArticle(w, code) { // incluye los elididos (l'ascenseur, un'amica) y los plurales (les skis)

    // ---- pronunciación: voces del propio navegador (la app no envía nada a internet para esto) ----
    var TTS_TAGS = { fr: ["fr-FR", "fr"], it: ["it-IT", "it"], pt: ["pt-PT", "pt-BR", "pt"], ca: ["ca-ES", "ca"], pl: ["pl-PL", "pl"], en: ["en-GB", "en-US", "en"], de: ["de-DE", "de"], el: ["el-GR", "el"] };
    var ttsVoices = [];
    function ttsLoad() {
      try { ttsVoices = (window.speechSynthesis && typeof SpeechSynthesisUtterance !== "undefined") ? (window.speechSynthesis.getVoices() || []) : []; } catch (e) { ttsVoices = []; }
      updateTtsClass();
    }
    function ttsInit() {
      if (!window.speechSynthesis) return;
      ttsLoad();
      try { if (window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener("voiceschanged", ttsLoad); else window.speechSynthesis.onvoiceschanged = ttsLoad; } catch (e) { }
    }
    function ttsVoice(code) { // la mejor voz para el idioma, o null: sin voz de ese idioma no se muestran los botones (mejor nada que mal pronunciado)
      var tags = TTS_TAGS[code] || [code], best = null;
      for (var i = 0; i < tags.length && !best; i++) {
        var t = tags[i].toLowerCase(), pre = t.split("-")[0], regional = t.indexOf("-") > 0;
        var m = ttsVoices.filter(function (v) { var l = String(v.lang || "").replace("_", "-").toLowerCase(); return regional ? l === t : (l === pre || l.indexOf(pre + "-") === 0); });
        if (m.length) best = m.filter(function (v) { return v.localService; })[0] || m[0];
      }
      return best;
    }
    function updateTtsClass() { document.body.classList.toggle("tts-on", !!(S.lang && ttsVoice(S.lang))); }
    function speakClean(t) { return String(t || "").replace(/\([^)]*\)/g, " ").replace(/\s*\/\s*/g, ", ").replace(/\s+/g, " ").trim(); }
    function speak(text) {
      var v = S.lang && ttsVoice(S.lang), t = speakClean(text);
      if (!v || !t) return false;
      try { window.speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.voice = v; u.lang = v.lang; u.rate = 0.9; window.speechSynthesis.speak(u); return true; } catch (e) { return false; }
    }
    function cardTarget(e, mode) { return mode === "sentence" ? e.deSent : e.deWord; } // lo que se pronuncia: siempre el idioma que estudias
    function flipCard() {
      S.flipped = true; render();
      if (S.autoSpeak && S.current) speak(cardTarget(findEntry(S.current.entry.id) || S.current.entry, S.mode));
    }
    function modeNoun(m) { return m === "sentence" ? "frases" : "palabras"; }

    // límites diarios de nuevas, a la vista en Estudiar: uno para palabras y otro para frases
    function limitSelect(id, cur, what) {
      var vals = [5, 10, 15, 20, 30, 50, 0];
      if (vals.indexOf(cur) < 0) { vals.push(cur); vals.sort(function (a, b) { return (a || 1e9) - (b || 1e9); }); }
      return '<select id="' + id + '" class="in sel-sm" aria-label="Límite diario de ' + what + ' nuevas">' +
        vals.map(function (n) { return '<option value="' + n + '"' + (cur === n ? " selected" : "") + ">" + (n ? n : "Sin límite") + "</option>"; }).join("") + "</select>";
    }
    function limitsHtml() {
      return '<div class="newlim"><span class="newlim-t">Nuevas al día</span>' +
        '<label class="newlim-i" for="newWords">Palabras</label>' + limitSelect("newWords", S.newWords, "palabras") +
        '<label class="newlim-i" for="newSents">Frases</label>' + limitSelect("newSents", S.newSents, "frases") + "</div>";
    }
    function renderEstudiar() {
      if (S.mode === "rev" && !S.revOn) S.mode = "word";
      var mode = S.mode, q = studyQueue(mode);
      var canUndo = S.undo.length && S.undo[S.undo.length - 1].code === S.lang;
      var npaused = S.deck.filter(function (e) { return e.paused; }).length;
      var segs = [["word", "Palabras"], ["sentence", "Frases"]].concat(S.revOn ? [["rev", "Inversa"]] : []);
      var header = '<div class="seg">' + segs.map(function (g) {

        }).join("") + "</div>" +
        '<div class="stats"><span class="stat"><b>' + q.reviews.length + '</b> por repasar</span>' +
        '<span class="stat stat-muted"><b>' + q.news.length + "</b> " + (q.news.length === 1 ? "nueva" : "nuevas") + (capFor(mode) ? " hoy" : "") + "</span>" +
        (q.waiting ? '<span class="stat stat-muted">' + q.waiting + " en espera</span>" : "") +

        (canUndo ? '<button class="link-btn undo-btn" id="undoBtn" title="Deshacer el último repaso (Z)">↶ Deshacer</button>' : "") + "</div>" + limitsHtml();
      var body;
      if (!q.all.length) {
        body = '<div class="empty">' + (mode === "sentence"

      } else {
        if (!S.current) pickNext();
        if (!S.current) {
          var nx = nextDueLabel(mode, q);
          body = '<div class="empty done"><div class="done-mark">✓</div>' +
            "<p>Todo al día en este modo.</p>" +
            (q.waiting ? '<p class="muted">Hoy ya has visto ' + newToday(mode) + " " + modeNoun(mode) + " nuevas (tope diario). Quedan " + q.waiting + " en espera: mañana, desde las 4:00, se te ofrecerán de nuevo.</p>" : "") +
            (nx ? '<p class="muted">Próximo repaso en ' + nx + ".</p>" : "") +

    function renderCard() {
      var e = findEntry(S.current.entry.id) || S.current.entry, mode = S.mode, isSent = mode === "sentence", isRev = mode === "rev";
      var typing = S.typeOn && mode === "word";

      var sw = !isSent
        ? '<button class="switch' + (S.autoSentence ? " on" : "") + '" id="autoSent" role="switch" aria-checked="' + (S.autoSentence ? "true" : "false") + '"><span class="switch-label">Frase</span><span class="switch-track"><span class="switch-thumb"></span></span></button>'
        : "";
      var tag = (isSent ? "frase" : "palabra") + " · " + (isRev ? S.lang + " → es" : "es → " + S.lang);
      var inner = '<div class="k-head"><div class="k-tag">' + tag + '</div><div class="k-tools">' + say + pause + sw + "</div></div>" +
        '<div class="k-front"' + (isSent ? ">" + hlHTML(front, e.esWord, esGenderInfo(e).g, "es") : (isRev ? genderStyle(e) : esGenderStyle(e)) + ">" + esc(front)) + "</div>";
      if (!S.flipped) {
        inner += typing ? typedHtml() : '<button class="btn btn-primary reveal" id="show">Mostrar respuesta</button>';
      } else {
        inner += '<div class="k-divider"></div>';
        inner += isSent
          ? '<div class="k-back k-back-sent">' + hlHTML(back, e.deWord, genderInfo(e).g, S.lang) + "</div>"
          : '<div class="k-back"' + (isRev ? esGenderStyle(e) : genderStyle(e)) + ">" + esc(back) + "</div>";
        if (typing && S.typed) inner += typedResHtml(S.typed);
        if (!isSent && e.esSent && e.deSent) {
          inner += '<button class="link-btn" id="seeSent">' + (S.showSentence ? "Ocultar frase" : "Ver frase") + "</button>";
          if (S.showSentence) {
            inner += '<div class="k-sent"><span class="k-sent-es">' + hlHTML(e.esSent, e.esWord, esGenderInfo(e).g, "es") + "</span>" +
              '<span class="k-sent-de">' + hlHTML(e.deSent, e.deWord, genderInfo(e).g, S.lang) + "</span></div>";
          }
        }
        var lap = entryState(e, Date.now()).lapses;
        if (lap >= LEECH) {
          inner += '<div class="leech-note">Esta entrada te ha fallado <b>' + lap + '</b> veces. Quizá ayude cambiarla (otra traducción o una frase de ejemplo) o pausarla un tiempo. ' +
            '<button class="link-btn" data-pause="card">Pausarla</button> · <button class="link-btn" data-edit="' + esc(e.id) + '">Editarla</button></div>';
        }
        var preview = schedPreview(getCard(S.current.key));
        function iv(r) { return fmtCard(preview[r]); }
        var sug = typing && S.typed ? (S.typed.v === "ok" ? "Good" : S.typed.v === "near" ? "Hard" : "Again") : "";
        function sg(r) { return sug === r ? " suggested" : ""; }
        inner += '<div class="rate">' +
          '<button class="r r-again' + sg("Again") + '" data-rate="Again"><span>Otra vez</span><em>' + iv("Again") + "</em></button>" +
          '<button class="r r-hard' + sg("Hard") + '" data-rate="Hard"><span>Difícil</span><em>' + iv("Hard") + "</em></button>" +
          '<button class="r r-good' + sg("Good") + '" data-rate="Good"><span>Bien</span><em>' + iv("Good") + "</em></button>" +
          '<button class="r r-easy' + sg("Easy") + '" data-rate="Easy"><span>Fácil</span><em>' + iv("Easy") + "</em></button></div>";

    function switchBtn(id, on, label) {
      return '<button class="switch' + (on ? " on" : "") + '" id="' + id + '" role="switch" aria-checked="' + (on ? "true" : "false") + '"><span class="switch-label">' + label + '</span><span class="switch-track"><span class="switch-thumb"></span></span></button>';
    }

    function retention30() { // de los repasos de tarjetas ya en repaso (no nuevas ni en aprendizaje), qué parte no fue «Otra vez»
      var cut = Date.now() / 1000 - 30 * 86400, n = 0, good = 0;
      (bucket(S.lang).log || []).forEach(function (r) { if (r[0] >= cut && r[3] === FS.State.Review) { n++; if (r[2] >= 2) good++; } });
      return { n: n, pct: n >= 20 ? Math.round(100 * good / n) : null };
    }
    function forecast(days) { // repasos que vencen cada día de estudio (los atrasados cuentan en hoy)
      var out = [], base = studyDayStart(Date.now());
      for (var i = 0; i < days; i++) out.push(0);
      var pz = {}; S.deck.forEach(function (e) { if (e.paused) pz[e.id] = 1; });
      Object.keys(S.review).forEach(function (k) {
        var raw = S.review[k];
        if (!raw || raw.state === FS.State.New || (k.slice(-4) === ":rev" && !S.revOn) || pz[k.split(":")[0]]) return;
        var off = Math.round((dueAt(reviveCard(raw)) - base) / 86400000);
        if (off < 0) off = 0;
        if (off < days) out[off]++;
      });
      return out;
    }

      var bars = fc.map(function (n, i) {

    document.querySelector(".tabs").addEventListener("click", function (ev) {
      var b = ev.target.closest(".tab"); if (!b) return;
      S.tab = b.dataset.tab;
      if (S.tab === "estudiar") { S.studyAhead = false; S.current = null; }
      if (S.tab === "mazo") S.deckShown = DECK_PAGE;
      render();
    });

    // controles que viven fuera de #view: tema y archivo de datos
    document.addEventListener("click", async function (ev) {
      var t = ev.target;
      closeGenderMenu(t.closest(".gwrap"));
      if (t.closest(".js-info")) { openInfo(); return; }
      if (t.closest("#diagBtn")) { runDiag(); return; }
      if (t.closest("#infoClose") || t.id === "infoOverlay") { closeInfo(); return; }
      if (t.closest(".js-theme")) { applyTheme(S.theme === "dark" ? "light" : "dark"); lsSet(K_THEME, S.theme); lsSet(K_SHARED_THEME, S.theme); return; }
      if (t.closest(".js-sib")) { lsSet(K_SHARED_THEME, S.theme); return; } // la otra web se abre con el tema que tienes aquí
      var a = t.closest("[data-act]");
      if (!a) return;
      var act = a.getAttribute("data-act");
      if (act === "bar-off") { S.bannerOff = true; renderBanners(); return; }
      if (act === "pick-folder") await pickFolder();
      else if (act === "reconnect") await reconnect();
    });

    view.addEventListener("click", async function (ev) {
      var t = ev.target;
      if (t.closest("#geminiBtn")) {
        var plan = aiPlan();
        if (!plan) { toast("Escribe primero una palabra o una frase para pedírsela a ChatGPT.", true); return; }
        var copied = copyText(plan.prompt);
        var win = window.open("https://chatgpt.com/?q=" + encodeURIComponent(plan.prompt) + "&temporary-chat=true", "_blank", "noopener");
        toast(win ? "Abriendo ChatGPT…" : (copied ? "Prompt copiado al portapapeles" : "No se pudo abrir ChatGPT"), !win && !copied);
        return;
      }
      if (t.closest("#sentSuggBtn")) { suggestSentences(false); return; }
      if (t.closest("#sentMore")) { suggestSentences(true); return; }
      if (t.closest("#sentRetry") || t.closest("#sentTat")) { suggestSentences(false, true); return; }
      if (t.closest("#suggRetry")) { S.suggErr = null; scheduleSuggLookup(true); return; }
      if (t.closest("#sentClose")) { S.sents = null; updateSentUI(); return; }
      if (t.closest(".sbtn-trans")) { translateSentence(); return; }
      var si = t.closest(".sent-item");
      if (si) { pickSentence(parseInt(si.getAttribute("data-i"), 10)); return; }
      var sg = t.closest(".sugg-chip");
      if (sg) { pickSuggestion(sg.getAttribute("data-sugg")); return; }
      var gt = t.closest(".gtrig");
      if (gt) { var gm = gt.parentNode.querySelector(".gmenu"), abrir = gm.hidden; closeGenderMenu(); gm.hidden = !abrir; gt.setAttribute("aria-expanded", abrir ? "true" : "false"); return; }
      var aa = t.closest("#artAdd");
      if (aa) {
        var wEl = document.getElementById("deWord"), art = aa.getAttribute("data-art");
        if (wEl && art) { wEl.value = art + " " + wEl.value.trim(); wEl.dispatchEvent(new Event("input", { bubbles: true })); scheduleFormLookup(true); wEl.focus(); }
        return;
      }
      var gb = t.closest(".gbtn");
      if (gb) {
        var gv = gb.getAttribute("data-g");
        if (gb.getAttribute("data-side") === "es") { S.formEsGender = S.formEsGender === gv ? "" : gv; closeGenderMenu(); updateEsGenderUI(); document.getElementById("esWord").focus(); return; }
        S.formGender = S.formGender === gv ? "" : gv; closeGenderMenu(); updateGenderUI(); scheduleFormLookup(true); document.getElementById("deWord").focus(); return;
      }
      if (t.closest(".js-detect")) { detectGenders({ manual: true }); return; }
      if (t.closest("#autoSuggSw")) { S.autoSugg = !S.autoSugg; lsSet(K_AUTOSUGG, S.autoSugg ? "1" : "0"); render(); return; }
      if (t.closest("#autoGenSw")) { S.autoGen = !S.autoGen; lsSet(K_AUTOGEN, S.autoGen ? "1" : "0"); render(); return; }
      if (t.closest("#save")) {
        var v = { esWord: val("esWord"), deWord: val("deWord"), esSent: noEndDot(val("esSent")), deSent: noEndDot(val("deSent")), gender: S.formGender, esGender: S.formEsGender };
        if (!S.formGender && S.formWikt && S.formWikt.word === v.deWord) v.autoGender = S.formWikt.g; // ya consultado en el formulario
        if (!S.formEsGender && S.sugg && S.sugg.key === v.esWord && S.sugg.g) v.esAutoGender = S.sugg.g;
        if (!v.esWord || !v.deWord) { toast("Rellena la palabra en los dos idiomas.", true); return; }
        if ((v.esSent && !v.deSent) || (!v.esSent && v.deSent)) { toast("La oración necesita las dos versiones (o deja ambas vacías).", true); return; }
        t.disabled = true;
        var ok = S.editing ? await updateEntry(S.editing, v) : await addEntry(v);
        t.disabled = false;
        if (ok) { toast((S.editing ? "Cambios guardados" : "Guardada") + (F.state === "error" || F.state === "needs-permission" || F.err[S.lang] ? " solo en este navegador" : "")); S.editing = null; S.formGender = ""; S.formEsGender = ""; S.formWikt = null; S.sugg = null; S.sents = null; afterEdit(); render(); focusFirst(); if (S.autoGen) detectGenders({ ids: [ok] }); }
        else { toast("No se pudo guardar. Reintenta.", true); }
        return;
      }
      var fr = t.closest("[data-frase]");
      if (fr) { toggleFrase(fr); return; }
      if (t.closest(".js-freset")) { resetFilters(); render(); var q0 = document.getElementById("deckQ"); if (q0) q0.focus(); return; }
      if (t.closest("#goMazo")) { S.tab = "mazo"; S.deckShown = DECK_PAGE; render(); window.scrollTo(0, 0); return; }
      if (t.closest("#deckMore")) { showMoreRows(false); return; }
      if (t.closest("#deckAll")) { showMoreRows(true); return; }
      var del = t.closest("[data-del]");
      if (del) { S.confirmDelete = del.getAttribute("data-del"); render(); return; }
      if (t.closest("#confirmYes")) { var did = S.confirmDelete; S.confirmDelete = null; var okd = await deleteEntry(did); if (!okd) toast("No se pudo eliminar.", true); render(); return; }
      if (t.closest("#confirmNo") || t.id === "modalOverlay") { S.confirmDelete = null; render(); return; }
      var ed = t.closest("[data-edit]");
      if (ed) { S.editing = ed.getAttribute("data-edit"); S.formGender = (findEntry(S.editing) || {}).gender || ""; S.formEsGender = (findEntry(S.editing) || {}).esGender || ""; S.formWikt = null; S.sugg = null; S.sents = null; S.editFrom = S.tab === "mazo" ? "mazo" : null; S.editY = window.scrollY; S.tab = "crear"; render(); focusFirst(); return; }
      if (t.closest("#cancelEdit")) { S.editing = null; S.formGender = ""; S.formEsGender = ""; S.formWikt = null; S.sugg = null; S.sents = null; afterEdit(); render(); focusFirst(); return; }
      var seg = t.closest(".seg-btn");
      if (seg) { S.mode = seg.dataset.mode; S.studyAhead = false; S.current = null; render(); return; }
      if (t.closest("#ahead")) { S.studyAhead = true; pickNext(); render(); return; }
      if (t.closest("#moreNew")) { var xk = S.lang + "|" + modeKey(S.mode); S.newExtra[xk] = (S.newExtra[xk] || 0) + 10; S.current = null; render(); return; }
      if (t.closest("#undoBtn")) { undoLast(); return; }
      var sy = t.closest("[data-say]");
      if (sy) { var sid = sy.getAttribute("data-say"), se = sid === "card" ? (S.current && (findEntry(S.current.entry.id) || S.current.entry)) : findEntry(sid); if (se) speak(sid === "card" ? cardTarget(se, S.mode) : se.deWord); return; }
      if (t.closest("#revSw")) { S.revOn = !S.revOn; lsSet(K_REV, S.revOn ? "1" : "0"); if (!S.revOn && S.mode === "rev") { S.mode = "word"; S.current = null; } render(); return; }
      if (t.closest("#autoSpeakSw")) { S.autoSpeak = !S.autoSpeak; lsSet(K_SPEAK, S.autoSpeak ? "1" : "0"); render(); return; }
      var pz = t.closest("[data-pause]");
      if (pz) { await togglePause(pz.getAttribute("data-pause")); return; }
      if (t.closest("#typedCheck")) { checkTyped(false); return; }
      if (t.closest("#typedSkip")) { checkTyped(true); return; }
      if (t.closest("#typeSw")) { S.typeOn = !S.typeOn; lsSet(K_TYPE, S.typeOn ? "1" : "0"); S.typed = null; render(); return; }
      if (t.closest("#show")) { flipCard(); return; }
      if (t.closest("#seeSent")) { S.showSentence = !S.showSentence; render(); return; }
      if (t.closest("#autoSent")) { S.autoSentence = !S.autoSentence; S.showSentence = S.autoSentence; lsSet(K_AUTO, S.autoSentence ? "1" : "0"); render(); return; }
      if (t.closest("#dirToggle")) { S.deckDir = S.deckDir === "es-it" ? "it-es" : "es-it"; render(); return; }
      if (t.closest("#expJson")) { exportJSON(); return; }
      if (t.closest("#expCsv")) { exportCSV(); return; }
      if (t.closest("#impListBtn")) { var lbox = document.getElementById("listImp"); if (lbox) { lbox.hidden = !lbox.hidden; if (!lbox.hidden) document.getElementById("listText").focus(); } return; }
      if (t.closest("#listFile")) { var lf = document.getElementById("listFileIn"); if (lf) { lf.onchange = function () { if (lf.files && lf.files[0]) { var f0 = lf.files[0]; lf.value = ""; f0.text().then(function (tx) { document.getElementById("listText").value = tx; checkList(); }); } }; lf.click(); } return; }
      if (t.closest("#listCheck")) { checkList(); return; }
      if (t.closest("#listAdd")) { addList(); return; }
      if (t.closest("#impBtn")) { var fi = document.getElementById("impFile"); if (fi) { fi.onchange = function () { if (fi.files && fi.files[0]) { var f = fi.files[0]; fi.value = ""; importJSON(f); } }; fi.click(); } return; }
      var rb = t.closest("[data-rate]");
      if (rb && S.current) { await rateCurrent(rb.getAttribute("data-rate"), rb); return; }
    });

    view.addEventListener("change", function (ev) {
      var cid = ev.target && ev.target.id;
      if (cid === "goalSel") { S.goal = Math.max(1, parseInt(ev.target.value, 10) || 10); lsSet(K_GOAL, String(S.goal)); render(); var gs = document.getElementById("goalSel"); if (gs) gs.focus(); toast("Meta diaria: " + S.goal + (S.goal === 1 ? " repaso" : " repasos")); return; }
      if (cid === "fState" || cid === "fSent" || cid === "fGender" || cid === "fSort") { S[cid] = ev.target.value; S.deckShown = DECK_PAGE; updateDeckList(); return; }
      if (cid === "qSent") { S.qSent = !!ev.target.checked; S.deckShown = DECK_PAGE; updateDeckList(); return; }
      if (ev.target && (ev.target.id === "newWords" || ev.target.id === "newSents")) {
        var isW = ev.target.id === "newWords", n = Math.max(0, parseInt(ev.target.value, 10) || 0), id = ev.target.id;
        if (isW) { S.newWords = n; lsSet(K_NEWWORDS, String(n)); } else { S.newSents = n; lsSet(K_NEWSENTS, String(n)); }
        S.current = null; render();
        var again = document.getElementById(id); if (again) again.focus();
        toast(isW ? (n ? "Hasta " + n + " palabras nuevas al día" : "Sin límite de palabras nuevas") : (n ? "Hasta " + n + " frases nuevas al día" : "Sin límite de frases nuevas"));
      }
    });
    view.addEventListener("input", function (ev) {
      if (ev.target && ev.target.id === "deckQ") {
        var qi = ev.target;
        clearTimeout(deckQT); deckQT = setTimeout(function () { S.q = qi.value; S.deckShown = DECK_PAGE; updateDeckList(); }, 150);
        return;
      }
      if (ev.target && (ev.target.id === "esWord" || ev.target.id === "deWord")) updateDupUI();
      if (ev.target && ev.target.id === "deWord") { updateGenderUI(); scheduleFormLookup(); updateSuggUI(); }
      if (ev.target && ev.target.id === "esWord") { updateEsGenderUI(); scheduleSuggLookup(); }
      if (ev.target && /^(esSent|deSent)$/.test(ev.target.id)) {
        if (/[\r\n]/.test(ev.target.value)) ev.target.value = ev.target.value.replace(/\s*[\r\n]+\s*/g, " "); // las frases son de una sola línea
        updateSentHL();
      }
      if (ev.target && /^(esWord|deWord|esSent|deSent)$/.test(ev.target.id)) { updateSentUI(); updateAiBtn(); }
    });
    window.addEventListener("resize", fitSentences);
    view.addEventListener("focusout", function (ev) {
      if (ev.target && /^(esSent|deSent)$/.test(ev.target.id)) {
        var t0 = ev.target.value, t1 = noEndDot(t0);
        if (t1 !== t0) { ev.target.value = t1; ev.target.dispatchEvent(new Event("input", { bubbles: true })); }
      }
      if (ev.target && ev.target.id === "deWord") scheduleFormLookup(true);
      if (ev.target && ev.target.id === "esWord") scheduleSuggLookup(true);
    });

    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && ev.target && /^(esSent|deSent)$/.test(ev.target.id)) { ev.preventDefault(); return; }
      if (ev.key === "Escape") { closeGenderMenu(); closeInfo(); }
      if (S.confirmDelete) { if (ev.key === "Escape") { S.confirmDelete = null; render(); } return; }
      if (S.lang && S.tab === "estudiar" && (ev.key === "z" || ev.key === "Z") && !ev.altKey && !(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName))) { ev.preventDefault(); undoLast(); return; }
      if (ev.key === "Enter" && ev.target && ev.target.id === "typedIn") { ev.preventDefault(); checkTyped(false); return; }
      if (!S.lang || S.tab !== "estudiar" || !S.current) return;
      if (ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
      if ((ev.key === "p" || ev.key === "P") && !ev.ctrlKey && !ev.metaKey && !ev.altKey && (S.flipped || S.mode === "rev")) { speak(cardTarget(findEntry(S.current.entry.id) || S.current.entry, S.mode)); return; }
      if (!S.flipped) {
        if (ev.key === "." || ev.key === " ") { ev.preventDefault(); flipCard(); }
        return;
      }
      var map = { "j": "Again", "0": "Again", "k": "Hard", "1": "Hard", "l": "Good", "2": "Good", "ñ": "Easy", "3": "Easy" };
      var kk = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
      if (map[kk]) {
        ev.preventDefault();
        rateCurrent(map[kk], document.querySelector('[data-rate="' + map[kk] + '"]'));
      }
    });

    function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; }
    // fuera del orden del tabulador todo lo que hay en el formulario salvo los campos y los botones de guardar / cancelar
    function skipTab() {
      var p = S.tab === "crear" ? view.querySelector("section.panel") : null;
      if (!p) return;
      p.querySelectorAll("button, a[href]").forEach(function (b) { if (b.id !== "save" && b.id !== "cancelEdit" && b.tabIndex !== -1) b.tabIndex = -1; });
    }
    new MutationObserver(skipTab).observe(view, { childList: true, subtree: true }); // también cuando cambian las sugerencias y los paneles
    function focusFirst() { var el = document.getElementById("esWord"); if (el) el.focus(); }
    function formHasText() { return ["esWord", "deWord", "esSent", "deSent"].some(function (id) { return !!val(id); }); }

    window.addEventListener("hashchange", function () { route(); if (S.lang && loaded[S.lang]) focusFirst(); });
    document.addEventListener("visibilitychange", function () { if (!document.hidden) syncFromFile(); });
    window.addEventListener("focus", syncFromFile);

    (async function () {
      buildPicker();
      applyTheme(lsGet(K_SHARED_THEME) === "light" || lsGet(K_SHARED_THEME) === "dark" ? lsGet(K_SHARED_THEME) : lsGet(K_THEME) === "light" ? "light" : "dark");
      document.querySelectorAll(".js-info").forEach(function (b) { b.innerHTML = ICON_INFO; });
      S.autoSentence = lsGet(K_AUTO) === "1";
      S.autoGen = lsGet(K_AUTOGEN) !== "0";
      S.autoSugg = lsGet(K_AUTOSUGG) !== "0";
      var legacyCap = lsGet(K_NEWDAY); // la versión anterior tenía un solo tope para todo: se usa como punto de partida de los dos
      var capPref = function (key, def) { var v = lsGet(key); if (v === null) v = legacyCap; return v === null ? def : Math.max(0, parseInt(v, 10) || 0); }; // 0 = sin límite
      S.newWords = capPref(K_NEWWORDS, 20); S.newSents = capPref(K_NEWSENTS, 10);
      S.revOn = lsGet(K_REV) === "1";
      S.autoSpeak = lsGet(K_SPEAK) === "1";
      S.goal = Math.max(1, Math.min(500, parseInt(lsGet(K_GOAL), 10) || 10));
      S.typeOn = lsGet(K_TYPE) === "1";
      ttsInit();
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { } // pide que el navegador no borre los datos locales
      if (/^https?:$/.test(location.protocol)) { // servida como web: instalable y con copia sin conexión (abierta como archivo no hace falta)
        var ml = document.createElement("link"); ml.rel = "manifest"; ml.href = "manifest.webmanifest"; document.head.appendChild(ml);
        if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) navigator.serviceWorker.register("sw.js").catch(function () { });
      }
      migrateOldCache();
      renderBanners();
      route();
      try { await initFile(); } catch (e) { F.state = F.supported ? "error" : "unsupported"; }
      initDone = true;
      if (S.lang) await loadLang(S.lang);
      if (F.state === "connected") await flushPending();
      bindLang(); renderBanners(); render();
      if (!S.lang) buildPicker();
      if (S.lang) focusFirst();
      if (!LS && !F.supported) toast("Vista previa: los datos no se guardan aquí.", true);
    })();
  })();
</script>
